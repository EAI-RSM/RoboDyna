render_freq: 0
episode_num: 8                 # debug: small batch
use_seed: false
save_freq: 15
embodiment: [aloha-agilex] #[ur5-wsg, ur5-wsg, 0.6]
language_num: 100
use_dynamic: false            # static path by default; tasks with a moving element flip this themselves
dynamic_level: 1              # dynamic complexity level(1,2,3)
dynamic_coefficient: 0.1      # dynamic coefficient
domain_randomization:
  random_background: false
  cluttered_table: false
  clean_background_rate: 1
  random_head_camera_dis: 0
  random_table_height: 0
  random_light: false
  crazy_random_light_rate: 0
camera:
  head_camera_type: D435
  wrist_camera_type: D435
  collect_head_camera: true
  collect_wrist_camera: true
data_type:
  rgb: true
  third_view: false
  depth: false
  pointcloud: false
  observer: false
  endpose: true
  qpos: true
  mesh_segmentation: false
  actor_segmentation: false
pcd_down_sample_num: 1024
pcd_crop: true
save_path: ./data
clear_cache_freq: 5
collect_data: true
eval_video_log: true
check_render_success: false   # debug: don't filter render-pass successes
# ---- LeRobot v2.1 export (inline, written alongside the HDF5/mp4 into one combined suite dataset) ----
export_lerobot: true
lerobot_root: ./data_lerobot/domino_suite
lerobot_chunks_size: 1000
lerobot_task_state_dim: 32
save_failed_cases: true       # debug: save every attempt (with its success flag) so a not-yet-fixed task's job always TERMINATES instead of looping seeds forever
# ---------------------------------------------------------------------------
# DEBUG mirror of demo_dynamic.yml: same per-task params, smaller batch + save-failed
# so jobs terminate while tuning. Invoke as `collect_data.sh <task> debug_dynamic 0`.
# Keep this task_args block in sync with demo_dynamic.yml.
# ---------------------------------------------------------------------------
task_args:
  toast_bread:
    toast_steps: 300
    target_doneness: 0.45
    plate_scale_mult: 0.65
    steamer_scale_mult: 0.10
  cook_meat:
    cook_steps: 1000
    target_doneness: 0.5
  assemble_markers_cylinder:
    side_cyl_radius: 0.018
    side_cyl_half_len: 0.10
    center_cyl_radius: 0.09
    center_cyl_half_len: 0.10
    center_x: 0.0
    center_y: 0.0
    attach_dist: 0.06
    attach_z: 0.04
    dwell_steps: 40
    side_group_x_offset: 0.18
    side_group_y_offset: 0.10
    side_group_x_jitter: 0.02
    side_group_y_jitter: 0.008
    center_table_clearance: 0.005
    rotation_direction: counter_clockwise
  catch_marbles_trapdoors:
    press_hold_steps: 24
    final_dwell_steps: 100
    button_press_depth: 0.03
    door_open_angle_deg: 95.0
    door_open_speed_deg: 220.0
    ball_speed: 0.18
    ball_bounce_height: 0.012
  catch_rat:
    num_appearances: 3
    pop_steps: 90
    grasp_tol: 0.05
  collect_falling_bowl:
    num_objects: 4
    emit_interval: 40
    fall_steps: 55
    rim_radius: 0.055
    pour_every: 3
  cup_curtain_slot:
    curtain_freq: 0.8
    curtain_amp: 0.05
    belt_speed: 0.04
    belt_range: 0.06
    placement_tol: 0.07
    gap_tol: 0.06
    reach_tol: 0.07
  dual_hole_punch:
    n_pages: 4
    punch_tol: 0.035
    belt_inward_reach: 0.13
    belt_outward_scale: 2.0
    equal_tile_spacing: true
    belt_speed: 0.02
    belt_continous_motion: false
    missing_tile_mode: true
    tile_pause_steps: 28
    square_gap: 0.015
    square_gap_min: 0.010
    square_gap_max: 0.030
  goalkeeper:
    ball_speed_min: 0.07
    ball_speed_max: 0.09
    ball_angle_deg_min: -10.0
    ball_angle_deg_max: 10.0
    goal_center_y: 0.10
    goal_center_y_jitter: 0.0
    green_area_x_len: 0.10
    green_area_y_extra: 0.05
    red_line_x: 0.06
    goal_x: 0.20
    keeper_x: 0.16
    keeper_goal_clearance: 0.05
    keeper_pose_tol: 0.03
  pick_cup_behind_fan:
    fan_omega_deg: 2.0
    gap_frac: 0.40
    theta_spill: 35.0
    fan_far_y: 0.12
  pick_ripe_apple:
    ripen_steps: 2500   # slow ripening: apple stays ~red through the grasp
    red_window_min: 0.48   # per-episode red target band (like cook_meat doneness)
    red_window_max: 0.52
    red_tolerance: 0.12
  place_block_belt:
    belt_speed: 0.06
    theta_max_deg: 30.0
    belt_ride_steps: 600
  rotating_shape_sorter:
    spin_speed: 0.9
    r_tol: 0.06
    align_window: 0.18
    max_track_steps: 900
  sort_apples_belt:
    n_apples: 10
    belt_speed: 0.012
    belt_speed_scale: 1.0
    advance_every: 4
    gate_default_left: true
  hit_target:
    board_half_size: 0.075
    center_half_size: 0.018
    sway_amp: 0.10
    sway_period: 900
    target_speed: 1.0
    target_y_offset: 0.050
    motion_x_min: 0.03
    motion_x_max: 0.24
    target_center_x_min: 0.12
    target_center_x_max: 0.15
    blocker_enabled: false
    blocker_dynamic: false
    blocker_radius: 0.040
    blocker_thickness: 0.002
    blocker_y_gap: 0.050
    blocker_z_offset: 0.0
    blocker_x_offset: 0.0
    blocker_speed_min: 0.70
    blocker_speed_max: 1.45
    blocker_speed_min_delta: 0.10
  ring_on_moving_peg:
    r_ring: 0.028
    catch_r: 0.07
    period: 3000
    amp_x: 0.010
    amp_y: 0.025
    amp_z: 0.018
  quality_control:
    n_tiles: 6
    color_mode: alternating   # alternating | random
    spacing_mode: random      # equal | random
    tile_spacing: 0.08        # equal-mode center-to-center gap
    spacing_min: 0.07         # random-mode min gap
    spacing_max: 0.22         # random-mode max gap (creates empty stamp windows)
    empty_gap_prob: 0.35      # chance to insert a large empty gap between tiles
    empty_gap_size: 0.20
  packing:
    n_cubes: 5
    belt_gap: 0.10
  two_type_sorting_catch:
    num_objects: 4
    fall_steps: 90
    lateral_bias: 0.16
    center_rate: 0.25
    catch_tol: 0.07
  catch_ramp_ball:
    ramp_angle: 0.24
    ball_radius: 0.018
    rim_radius: 0.04
    x_span: 0.15
    roll_time_min: 5.0      # s; kinematic roll(t1)+fall lasts ~10-20s
    roll_time_max: 20.0
    fall_time: 0.5          # s; short accelerating drop off the edge
    idle_time_min: 2.0      # s; robot stays still before grasping
    idle_time_max: 4.0
    settle_steps: 70
  catch_valley_ball:
    ramp_half_width: 0.125
    ramp_thickness: 0.012
    ramp_center_y: 0.08
    ramp_valley_x: -0.02
    ramp_valley_height: 0.025
    down_run: 0.27
    down_rise: 0.13
    up_run: 0.20
    up_rise: 0.055
    curve_segments: 16
    rail_height: 0.055
    ball_radius: 0.018
    drop_height: 0.14
    drop_time: 0.60
    ball_path_mode: random   # straight, angled, or random
    angled_path_min_deg: 15.0
    angled_path_max_deg: 25.0
    drop_forward_angle_min_deg: -8.0
    drop_forward_angle_max_deg: 12.0
    initial_forward_speed_min: 0.90
    initial_forward_speed_max: 1.10
    physics_max_steps: 1200
    red_line_gap: 0.05
    roll_time_min: 4.0
    roll_time_max: 7.0
    roll_acceleration: 0.35
    launch_speed: 0.72
    idle_time_min: 1.0
    idle_time_max: 2.0
    settle_steps: 150
    bowl_id: 1
    bowl_scale_mult: 0.65
    bowl_inner_radius: 0.028
    bowl_outer_radius: 0.037
    bowl_height: 0.040
