    press_overshoot: 0.012      # m; drive the head this far into the crown
    strike_xy_tol: 0.030        # m; head-vs-hole XY error allowed before stroke
    strike_attempts: 4          # approach/wait/strike cycles per mole
    approach_max_frac: 0.35     # re-hover while mole is this low
    approach_falling_frac: 0.55 # or mid-fall (never crest)
    hover_clearance: 0.018       # m; short jab above raised mole
    touch_tol: 0.04             # m; legacy XY touch tol (head footprint is authoritative)
    hole_count: 9               # openings on board
    hole_size: 0.0825           # m; hole opening side length
    hole_bar_thickness: 0.014   # m; bar thickness between holes
    cube_hole_scale: 1.20       # legacy; mallets use head size, not cubes
    cube_grasp_drop_z: 0.05     # m; legacy grasp drop (mallet uses cradle height)
    mole_scale_mult: 1.80       # 1.5x prior mole size
    mole_height: 0.1053         # m; world height after mole_scale_mult (pop travel)
    rabbit_scale_mult: 1.00     # 224_rabbit authored near mole height
    rabbit_height: 0.1047       # m; rabbit world height
    table_height_bias: 0.05     # m; raise table (+board) this much
    board_z_lift: 0.06          # m; half-height compact board above the table
    board_color: [0.98, 0.82, 0.05]  # RGB board color (yellow)
  boil_milk:
    # KitchenS: center sink+tap, cooking range on the side. Pot of milk on a
    # burner; grasp and twist the front knob to toggle heat. Milk rises while
    # on and settles back when off. Success = on then off before overflow.
    scene_id: 0                 # MW left, rack center, range right (right-arm reach)
    boil_steps: 6000            # steps for liquid_level 0→1 while stove is on
    settle_steps: 1200          # steps for liquid to return toward baseline when off
    baseline_level: 0.35        # resting fill fraction
    expert_shutoff_level: 0.62  # level at which the expert starts reaching back
    overflow_level: 0.95        # spill / failure threshold
    pot_id: 0                   # unused (procedural pot); kept for schema compat
    knob_contact_radius: 0.06   # m; pinch-to-knob distance that counts as held
  cook_food:
    # KitchenS: food starts on chopping board → pan → cook via knob → plate.
    # food_type: meat|sausage|onion_half|random
    scene_id: 0
    food_type: random
    burner: left_front
    range_xy: [0.02, 0.08]
    cook_steps: 2000
    cook_speed_jitter: 0.0
    shutoff_lead: 0.04
    cook_intensity: 0.75
    pan_scale: 0.72
    skillet_id: 2
    place_dx: 0.0
    place_dy: 0.01
    plate_scale: 0.55
    board_scale_mult: 0.07
    knob_contact_radius: 0.06
  pour_beer:
    # KitchenS: pull the hinged beer-tap lever by hand; flow follows opening.
    # Pause so foam settles; foam over the rim = fail. Fill glass (>90% beer) to succeed.
    scene_id: 0
    pour_rate: 0.000715
    foam_gain_start: 0.18
    foam_gain: 0.85
    foam_ramp_steps: 70
    foam_decay: 0.0045
    expert_foam_pause: 0.16
    expert_foam_resume: 0.09
    target_liquid: 0.90
    safe_total: 0.96
    full_liquid_tol: 0.05
  clean_table:
    # Cup tips; brown spill grows toward laptop (~30 cm). Wipe with sponge in time.
    station_x: 0.12
    cup_y: -0.06
    laptop_dist: 0.30
    sponge_dx: 0.10
    sponge_y: -0.18
    cup_id: 0
    laptop_id: 0
    spill_steps: 1067
    expert_wipe_level: 0.18
    reach_laptop_level: 0.92
    clean_rate: 0.0045
    clean_tol: 0.08
  measure_ingredient:
    # KitchenS baking counter: pour oil, then place jar on electronic scale.
    # oil_style: solid (opaque sunflower yellow) | transparent (see-through amber)
    scene_id: 0
    target_fill: 0.25
    pour_rate: 0.00022
    fill_tol: 0.02
    overflow_level: 1.02
    oil_style: solid
    scale_id: 0
    station_x: -0.08
    disp_y: 0.08
    jar_y: -0.06
    jar_start_gap: 0.08
    scale_x: -0.32
    scale_y: -0.14
    scale_dist: 0.25
    scale_dist_jitter: 0.10
    scale_near_dx_range: [-0.28, -0.16]
    scale_near_dy_range: [-0.12, -0.02]
    chips_xy: [0.16, 0.08]
  make_soup:
    # KitchenS: chopping board with colored cubes + tomato; pot of water on range.
    # Burner starts on. Lift board level, tip so pieces slide into pot (PhysX).
    scene_id: 0
    burner: left_front
    range_xy: [0.18, 0.22]
    water_level: 0.45
    pot_radius: 0.06435          # prior 0.0715 × 0.9
    pot_height: 0.075
    board_half: [0.095, 0.052, 0.010]  # y prior 0.065 × 0.8
    handle_half: [0.022, 0.024, 0.022]
    board_x: 0.16
    board_y: -0.08
    cube_half: 0.012
    tomato_radius: 0.015
    tilt_hold_dot: 0.82
    tilt_spill_dot: 0.50
    pour_tip_rad: 0.96
    knob_contact_radius: 0.06
    grasp_tcp_tol: 0.045
    plate_x: -0.18
    plate_y: -0.08
    plate_scale: 0.55
    bread_scale: 1.0
    wine_x: -0.30
    wine_y: -0.02
    wine_scale: 1.0
    glass_x: -0.22
    glass_y: -0.16
    glass_scale: 0.45
