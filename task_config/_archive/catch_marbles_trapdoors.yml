# if you want to modify the config, please check the following tutorial first:
# https://robotwin-platform.github.io/doc/usage/configurations.html
render_freq: 0
episode_num: 8
use_seed: false
save_freq: 15
embodiment: [aloha-agilex]
language_num: 100
domain_randomization:
  random_background: false
  cluttered_table: false
  clean_background_rate: 1
  random_head_camera_dis: 0
  random_table_height: 0
  random_light: false
  crazy_random_light_rate: 0
camera:
  head_camera_type: D435
  wrist_camera_type: D435
  collect_head_camera: true
  collect_wrist_camera: true
data_type:
  rgb: true
  third_view: false
  depth: false
  pointcloud: false
  observer: false
  endpose: true
  qpos: true
  mesh_segmentation: false
  actor_segmentation: false
pcd_down_sample_num: 1024
pcd_crop: true
save_path: ./data
clear_cache_freq: 5
collect_data: true
eval_video_log: true
task_args:
  catch_marbles_trapdoors:
    press_hold_steps: 24
    final_dwell_steps: 100
    button_press_depth: 0.03
    door_open_angle_deg: 95.0
    door_open_speed_deg: 220.0
    door_open_duration_sec: 0.5
    door_open_once: false       # opt1: true = open each door only once
    enable_distractor: false    # opt2: true = black distractor marble
    distractor_collide: false   # false=pass through, true=bounce
    distractor_height_offset: 0.0  # keep 0 = same Z as target
    distractor_y_offset: 0.030  # parallel Y lane so marbles do not collide
    distractor_speed: null
    distractor_speed_scale_min: 0.8
    distractor_speed_scale_max: 1.2
    target_color: null          # null/random = 1 of 4; or red|yellow|blue|green | 0..3
                                # left-side trapdoor → left arm; right-side → right arm
    shuffle_colors: true
    key_base_half: [0.032, 0.032, 0.005]
    ball_speed: 0.18            # nominal; episode speeds sample ±20%
    ball_speed_scale_min: 0.8
    ball_speed_scale_max: 1.2
    ball_bounce_height: 0.012
