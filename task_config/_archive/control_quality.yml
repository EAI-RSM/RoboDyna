# if you want to modify the config, please check the following tutorial first:
# https://robotwin-platform.github.io/doc/usage/configurations.html
render_freq: 0
episode_num: 8
use_seed: false
save_freq: 15
embodiment: [aloha-agilex]
language_num: 100
domain_randomization:
  random_background: false
  cluttered_table: false
  clean_background_rate: 1
  random_head_camera_dis: 0
  random_table_height: 0
  random_light: false
  crazy_random_light_rate: 0
camera:
  head_camera_type: D435
  wrist_camera_type: D435
  collect_head_camera: true
  collect_wrist_camera: true
data_type:
  rgb: true
  third_view: false
  depth: false
  pointcloud: false
  observer: false
  endpose: true
  qpos: true
  mesh_segmentation: false
  actor_segmentation: false
pcd_down_sample_num: 1024
pcd_crop: true
save_path: ./data
clear_cache_freq: 5
collect_data: true
eval_video_log: true
task_args:
  quality_control:
    # Default: color_mode=alternating, black_frac_max=0 (no distractors)
    # Opt 1: color_mode=random | Opt 2: black_frac_max>0 (e.g. 0.50)
    # tile_pause_s = max hold under stamp; miss unstamped red/green → fail
    n_tiles: 6
    color_mode: alternating
    spacing_mode: random
    tile_spacing: 0.08
    spacing_min: 0.07
    spacing_max: 0.14
    black_frac_max: 0.0
    tile_pause_s: 2.0
