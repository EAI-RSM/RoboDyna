# if you want to modify the config, please check the following tutorial first:
# https://robotwin-platform.github.io/doc/usage/configurations.html
render_freq: 0
episode_num: 8
use_seed: false
save_freq: 15
embodiment: [aloha-agilex]
language_num: 100
domain_randomization:
  random_background: false
  cluttered_table: false
  clean_background_rate: 1
  random_head_camera_dis: 0
  random_table_height: 0
  random_light: false
  crazy_random_light_rate: 0
camera:
  head_camera_type: D435
  wrist_camera_type: D435
  collect_head_camera: true
  collect_wrist_camera: true
data_type:
  rgb: true
  third_view: false
  depth: false
  pointcloud: false
  observer: false
  endpose: true
  qpos: true
  mesh_segmentation: false
  actor_segmentation: false
pcd_down_sample_num: 1024
pcd_crop: true
save_path: ./data
clear_cache_freq: 5
collect_data: true
eval_video_log: true
task_args:
  assemble_markers_cylinder:
    side_cyl_radius: 0.018
    side_cyl_half_len: 0.10
    center_cyl_radius: 0.09
    center_cyl_half_len: 0.10
    center_x: 0.0
    center_y: 0.0
    side_group_x_offset: 0.18
    side_group_y_offset: 0.13
    attach_dist: 0.06
    attach_z: 0.04
    dwell_steps: 40
    center_table_clearance: 0.005
    rotation_direction: counter_clockwise
save_failed_cases: true
