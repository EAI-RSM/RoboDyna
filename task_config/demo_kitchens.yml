# KitchenS-flavored collection config for boil_milk (UR5e + WSG).
render_freq: 0
episode_num: 1
use_seed: false
save_freq: 25
embodiment: [ur5-wsg, ur5-wsg, 0.6]
language_num: 100
use_dynamic: true
dynamic_level: 1
dynamic_coefficient: 0.1
domain_randomization:
  random_background: false
  cluttered_table: false
  clean_background_rate: 1
  random_head_camera_dis: 0
  random_table_height: 0
  random_light: false
  crazy_random_light_rate: 0
camera:
  head_camera_type: D435
  wrist_camera_type: D435
  collect_head_camera: true
  collect_wrist_camera: true
data_type:
  rgb: true
  third_view: false
  depth: false
  pointcloud: false
  observer: false
  endpose: true
  qpos: true
  mesh_segmentation: false
  actor_segmentation: false
pcd_down_sample_num: 1024
pcd_crop: true
save_path: ./data
clear_cache_freq: 5
collect_data: true
eval_video_log: true
save_failed_cases: false
check_render_success: false
task_args:
  boil_milk:
    scene_id: 0
    # Stove pulled forward off the backsplash so the knob is in easy arm reach.
    range_xy: [0.42, 0.13]
    # The pot boils through the whole reach for the knob (~960 steps), so the
    # rise is slow enough that the shutoff motion still lands under overflow.
    boil_steps: 6000            # steps for liquid_level 0→1 while stove is on
    settle_steps: 1200          # steps for liquid to return toward baseline when off
    baseline_level: 0.35
    expert_shutoff_level: 0.55  # milk keeps rising during the reach; leave lead time
    overflow_level: 0.98        # rim; spill + fail if reached while stove on
    # force_overflow: true      # demo failure: leave burner on until spill
    pot_radius: 0.054           # m; prior teapot then −30%
    pot_height: 0.0735          # m; prior teapot then −30%
    handle_length: 0.091        # m; saucepan dual-rod handle (−30%)
    range_scale_mult: 1.05      # 1.5× stove then −30%
    microwave_scale_mult: 1.3   # +30% microwave
    milk_box_id: -1             # -1 = random 038_milk-box variant
    milk_box_height: 0.20       # m; ~1 L carton
    mug_id: 0                   # 039_mug/base0 (classic ceramic)
    mug_height: 0.105           # m; ~10.5 cm coffee mug
    mug_gap: 0.16               # m; beside milk, clear of knob approach
    knob_contact_radius: 0.06
  cook_food:
    scene_id: 0
    # food_type: meat | chicken | sausage | random
    # Food starts on a chopping board; expert places into pan, cooks via knob, then plates.
    food_type: random
    # burner: left_front | left_rear | right_front | right_rear
    burner: left_front
    # Counter-local stove XY (shifted left vs default +0.42).
    range_xy: [0.02, 0.08]
    cook_steps: 2000            # steps for doneness 0→1 while stove is on
    cook_speed_jitter: 0.0
    shutoff_lead: 0.04
    cook_intensity: 0.75        # expert knob turn as fraction of 180°
    pan_scale: 0.60
    plate_scale: 0.55
    board_scale_mult: 0.07
    knob_contact_radius: 0.06
  pour_beer:
    scene_id: 0
    bottle_beer_frac: 0.90
    pour_rate: 0.004
    foam_gain: 1.8
    foam_decay: 0.0035
    expert_foam_stop: 0.82
    expert_foam_resume: 0.55
    target_liquid: 0.90
    full_liquid_tol: 0.05
  measure_ingredient:
    # Baking counter (no sink/tap/stove): pour oil, then place jar on scale.
    scene_id: 0
    target_fill: 0.25
    pour_rate: 0.00022
    fill_tol: 0.02
    # oil_style: solid (opaque sunflower yellow) | transparent (see-through amber)
    oil_style: solid
    scale_id: 0
    station_x: -0.08
    disp_y: 0.08
    jar_y: -0.06
    scale_x: -0.32
    scale_y: -0.14
    bread_xy: [0.22, -0.10]
    flour_xy: [0.08, 0.06]
    chips_xy: [0.16, 0.08]
    bowl_xy: [0.30, 0.05]
    board_scale_mult: 0.07
  empty_bag:
    # Kitchen Large: knock over kraft grocery bag; catch rolling apple.
    # Center microwave removed; no fridge decor (clear workspace).
    scene_id: 0
    bag_side: left              # left | right | random — knock arm side
    bag_x_abs: 0.16
    bag_y: -0.05
    bag_scale_mult: 1.0
    apple_color: random         # green | red | random
    veg_scale_mult: 0.035
    table_edge_y: -0.30
    grasp_tol: 0.08
    grasp_hover_z: 0.14
    grasp_tcp_dz: 0.02
    post_catch_lift: 0.08

  make_soup:
    # KitchenS: chopping board with colored cubes + tomato; pot of water on range.
    # Lift board level, tip so pieces slide into pot (PhysX), then turn stove on.
    scene_id: 0
    burner: left_front
    range_xy: [0.18, 0.22]       # back of the counter, knob still in arm reach
    range_scale_mult: 1.05       # boil_milk appliance scale
    microwave_scale_mult: 1.3
    water_level: 0.45
    # Original two-handled pot, sized to the boil_milk saucepan.
    pot_radius: 0.058
    pot_height: 0.0735
    pot_wall: 0.005
    board_half: [0.095, 0.065, 0.010]
    handle_half: [0.022, 0.024, 0.022]
    board_x: 0.16                # clear of the range apron / knob panel
    board_y: -0.14
    cube_half: 0.012
    tomato_radius: 0.015
    tilt_hold_dot: 0.82
    tilt_spill_dot: 0.50
    pour_tip_rad: 0.70           # wrist roll for the pour (~40°)
    knob_contact_radius: 0.06
    grasp_tcp_tol: 0.045
    # Left-side decor
    plate_x: -0.18
    plate_y: -0.08
    plate_scale: 0.55
    bread_scale: 1.0
    wine_x: -0.30
    wine_y: -0.02
    wine_scale: 1.0
    glass_x: -0.22
    glass_y: -0.16
    glass_scale: 0.585           # prior 0.45 × 1.3
  make_soup_test:
    # Same as make_soup, but flush 4-burner gas cooktop + top-facing knob.
    scene_id: 0
    burner: left_front
    range_xy: [0.18, 0.14]
    range_scale_mult: 1.0
    microwave_scale_mult: 1.3
    water_level: 0.45
    pot_radius: 0.058
    pot_height: 0.0735
    pot_wall: 0.005
    board_half: [0.095, 0.065, 0.010]
    handle_half: [0.022, 0.024, 0.022]
    board_x: 0.16
    board_y: -0.14
    cube_half: 0.012
    tomato_radius: 0.015
    tilt_hold_dot: 0.82
    tilt_spill_dot: 0.50
    pour_tip_rad: 0.70
    knob_contact_radius: 0.06
    grasp_tcp_tol: 0.045
    plate_x: -0.18
    plate_y: -0.08
    plate_scale: 0.55
    bread_scale: 1.0
    wine_x: -0.30
    wine_y: -0.02
    wine_scale: 1.0
    glass_x: -0.22
    glass_y: -0.16
    glass_scale: 0.585
  serve_dinner:
    # KitchenS: pan with 3–4 meatballs on a lit burner (right-top); plate left-center.
    # Turn stove off, tip pan so meatballs land on plate. Salad bowl + bottle + cup decor.
    scene_id: 0
    burner: left_front
    range_xy: [0.34, 0.18]
    plate_x: 0.00
    plate_y: -0.06
    pan_scale: 1.0
    range_scale_mult: 1.05
    plate_scale: 1.05          # prior 1.5 × 0.7 (−30%)
    meatball_radius: 0.015
    tilt_hold_dot: 0.78
    pour_tip_rad: 1.13           # ~65° tip so balls roll over the rim
    knob_contact_radius: 0.06
    salad_x: -0.22
    salad_y: -0.02
    bottle_x: -0.32
    bottle_y: -0.12
    cup_x: -0.18
    cup_y: -0.18
    salad_bowl_scale: 1.15
    lettuce_scale: 1.35
    tomato_scale: 1.25
