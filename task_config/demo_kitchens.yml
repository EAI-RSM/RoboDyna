# KitchenS-flavored collection config for boil_milk (UR5e + WSG).
render_freq: 0
episode_num: 1
use_seed: false
save_freq: 25
embodiment: [ur5-wsg, ur5-wsg, 0.6]
language_num: 100
use_dynamic: true
dynamic_level: 1
dynamic_coefficient: 0.1
domain_randomization:
  random_background: false
  cluttered_table: false
  clean_background_rate: 1
  random_head_camera_dis: 0
  random_table_height: 0
  random_light: false
  crazy_random_light_rate: 0
camera:
  head_camera_type: D435
  wrist_camera_type: D435
  collect_head_camera: true
  collect_wrist_camera: true
data_type:
  rgb: true
  third_view: false
  depth: false
  pointcloud: false
  observer: false
  endpose: true
  qpos: true
  mesh_segmentation: false
  actor_segmentation: false
pcd_down_sample_num: 1024
pcd_crop: true
save_path: ./data
clear_cache_freq: 5
collect_data: true
eval_video_log: true
save_failed_cases: false
check_render_success: false
task_args:
  boil_milk:
    scene_id: 0
    # The pot boils through the whole reach for the knob (~960 steps), so the
    # rise is slow enough that the shutoff motion still lands under overflow.
    boil_steps: 6000            # steps for liquid_level 0→1 while stove is on
    settle_steps: 1200          # steps for liquid to return toward baseline when off
    baseline_level: 0.35
    expert_shutoff_level: 0.62  # level at which the expert starts reaching back
    overflow_level: 0.95
    knob_contact_radius: 0.06
  cook_food:
    scene_id: 0
    # food_type: meat | chicken | sausage | random
    # Food starts on a chopping board; expert places into pan, cooks via knob, then plates.
    food_type: random
    # burner: left_front | left_rear | right_front | right_rear
    burner: left_front
    # Counter-local stove XY (shifted left vs default +0.42).
    range_xy: [0.02, 0.08]
    cook_steps: 2000            # steps for doneness 0→1 while stove is on
    cook_speed_jitter: 0.0
    shutoff_lead: 0.04
    cook_intensity: 0.75        # expert knob turn as fraction of 180°
    pan_scale: 0.60
    plate_scale: 0.55
    board_scale_mult: 0.07
    knob_contact_radius: 0.06
  pour_beer:
    scene_id: 0
    bottle_beer_frac: 0.90
    pour_rate: 0.004
    foam_gain: 1.8
    foam_decay: 0.0035
    expert_foam_stop: 0.82
    expert_foam_resume: 0.55
    target_liquid: 0.90
    full_liquid_tol: 0.05
  measure_ingredient:
    # Baking counter (no sink/tap/stove): pour oil, then place jar on scale.
    scene_id: 0
    target_fill: 0.25
    pour_rate: 0.00022
    fill_tol: 0.02
    # oil_style: solid (opaque sunflower yellow) | transparent (see-through amber)
    oil_style: solid
    scale_id: 0
    station_x: -0.08
    jar_y: -0.16
    scale_x: -0.32
    scale_y: -0.14
    bread_xy: [0.22, -0.10]
    flour_xy: [0.08, 0.06]
    chips_xy: [0.16, 0.08]
    bowl_xy: [0.30, 0.05]
    board_scale_mult: 0.07
  empty_bag:
    # Kitchen Large scene (fridge + microwave + basket + cabinet).
    scene_id: 0
    bag_side: left              # left | right | random — emptying arm side
    bag_x_abs: 0.20
    bag_y: -0.12
    bag_scale_mult: 1.0
    # rolling_choice: apple | jam | can | bottle | null(=random)
    rolling_choice: null
    apple_color: random         # green | red | random (apple only)
    veg_scale_mult: 0.035       # 069_vagetable raw meshes are ~2m; ~7cm when scaled
    roll_speed: 0.10
    table_edge_y: -0.30
    intercept_frac: 0.35
    grasp_tol: 0.08
    grasp_hover_z: 0.16
    grasp_tcp_dz: 0.025
    post_catch_lift: 0.10
  make_soup:
    # KitchenS: chopping board with colored cubes + tomato; pot of water on range.
    # Lift board level, pour into pot (physics), then turn stove on. No spills.
    scene_id: 0
    burner: left_front
    range_xy: [0.20, 0.06]
    water_level: 0.45
    pot_radius: 0.055
    pot_height: 0.075
    board_half: [0.095, 0.065, 0.010]
    cube_half: 0.012
    tomato_radius: 0.015
    tilt_hold_dot: 0.82          # soft friction break during pour ≈35° tip
    tilt_spill_dot: 0.50         # accidental spill during carry ≈60° tip
    pour_tip_rad: 0.96           # expert pour tip (~55°)
    knob_contact_radius: 0.06
  serve_dinner:
    # KitchenS: pan with 3–4 meatballs in sauce on a lit burner; plate in front.
    # Turn stove off, lift pan level, tip so meatballs land on the plate (physics).
    # Any meatball off the plate = fail.
    scene_id: 0
    burner: left_front
    range_xy: [0.18, 0.06]
    pan_scale: 0.60
    plate_scale: 0.55
    meatball_radius: 0.016
    # n_meatballs: 3 | 4 | omit for random 3–4
    tilt_hold_dot: 0.82          # soft friction break during pour ≈35° tip
    pour_tip_rad: 0.87           # expert pour tip (~50°)
    knob_contact_radius: 0.06
