# if you want to modify the config, please check the following tutorial first:
# https://robotwin-platform.github.io/doc/usage/configurations.html
render_freq: 0
episode_num: 1
use_seed: false
save_freq: 15
embodiment: [aloha-agilex]
language_num: 100
domain_randomization:
  random_background: false
  cluttered_table: false
  clean_background_rate: 1
  random_head_camera_dis: 0
  random_table_height: 0
  random_light: false
  crazy_random_light_rate: 0
camera:
  head_camera_type: D435
  wrist_camera_type: D435
  collect_head_camera: true
  collect_wrist_camera: true
data_type:
  rgb: true
  third_view: false
  depth: false
  pointcloud: false
  observer: false
  endpose: true
  qpos: true
  mesh_segmentation: false
  actor_segmentation: false
pcd_down_sample_num: 1024
pcd_crop: true
save_path: ./data
clear_cache_freq: 1
collect_data: true
eval_video_log: true
# Task-scoped knobs (read by envs that look under task_args.<task_name>).
task_args:
  fill_coffee_jar:
    # Success = dense pile height ≥ target_fill (red-ring scale).
    # Hold duration (sec) maps linearly to beans_per_press_min..beans_per_press.
    target_fill: 0.25
    scene_id: 0
    beans_full: 160
    press_duration_min: 0.35
    press_duration_max: 1.40
    beans_per_press_min: 2
    beans_per_press: 12
    fill_tol: 0.02
  measure_ingredient:
    # Open nozzle tab → olive oil fills marked jar; close tab to stop.
    target_fill: 0.25
    scene_id: 0
    pour_rate: 0.0015
    fill_tol: 0.02
    # oil_style: transparent (see-through amber) | solid (previous dark-green)
    oil_style: transparent
  pour_beer:
    scene_id: 0
    bottle_beer_frac: 0.90
    pour_rate: 0.004
    foam_gain: 1.8
    foam_decay: 0.0035
    expert_foam_stop: 0.82
    expert_foam_resume: 0.55
    target_liquid: 0.90
    full_liquid_tol: 0.05
