# if you want to modify the config, please check the following tutorial first:
# https://robotwin-platform.github.io/doc/usage/configurations.html
render_freq: 0
episode_num: 1
use_seed: false
save_freq: 15
embodiment: [aloha-agilex]
language_num: 100
domain_randomization:
  random_background: false
  cluttered_table: false
  clean_background_rate: 1
  random_head_camera_dis: 0
  random_table_height: 0
  random_light: false
  crazy_random_light_rate: 0
camera:
  head_camera_type: D435
  wrist_camera_type: D435
  collect_head_camera: true
  collect_wrist_camera: true
data_type:
  rgb: true
  third_view: false
  depth: false
  pointcloud: false
  observer: false
  endpose: true
  qpos: true
  mesh_segmentation: false
  actor_segmentation: false
pcd_down_sample_num: 1024
pcd_crop: true
save_path: ./data
clear_cache_freq: 1
collect_data: true
eval_video_log: true
# Task-scoped knobs (read by envs that look under task_args.<task_name>).
task_args:
  fill_coffee_jar:
    # Success = fill in [target_fill ± fill_tol]. target_fill: 0.25|0.5|0.75|random
    # Peak button press force → beans dispensed → fill level (beans/beans_full).
    # No microwave. Stove L/R; dispenser on the opposite half in a tight press band.
    target_fill: random
    scene_id: 0
    stove_side: random
    randomize_layout: true
    range_xy: [0.28, 0.14]
    range_x_right: 0.28
    range_x_left: -0.28
    station_x: -0.08
    station_x_left_lo: -0.105
    station_x_left_hi: -0.07
    station_x_right_lo: 0.055
    station_x_right_hi: 0.085
    disp_y: -0.02
    disp_y_up: 0.015
    disp_y_down: 0.02
    jar_y_min: -0.17
    beans_full: 160                              # rim = 100% fill
    force_thresholds: [3.0, 6.0, 10.0, 14.0]   # N  (light → hard)
    beans_per_force_level: [1, 5, 10, 15]       # light → hard press
    force_stiffness: 800.0                       # N/m spring engagement proxy
    force_engage_slack: 0.05                     # m pressure engagement above key top
    press_depths: [0.020, 0.030, 0.044, 0.057]  # expert depths for levels 1–4
    press_sample_s: 0.40
    fill_tol: 0.05                               # ±5% success band
    coffee_box_id: -1                            # -1 = random 113_coffee-box
    milk_box_id: -1                              # -1 = random 038_milk-box
    mug_id: -1                                   # -1 = random 039_mug
    kettle_id: -1                                # -1 = random 009_kettle
    kettle_burner: random                        # random | left_front | right_front | ...
  measure_ingredient:
    # Push jar under nozzle, fill to target ring (spill outside = fail).
    target_fill: 0.25
    fill_levels: [0.25, 0.50, 0.75, 1.0]
    scene_id: 0
    pour_rate: 0.00022
    # Sample fill speed ∼ Uniform(1±pour_rate_jitter) * pour_rate (0 = fixed).
    pour_rate_jitter: 0.15
    fill_tol: 0.05
    # oil_style: solid (opaque sunflower yellow) | transparent (see-through amber)
    oil_style: solid
    scale_id: 0
    randomize_layout: true
    microwave_pose: random
    microwave_top_left: [-0.32, 0.18]
    microwave_left_corner: [-0.48, 0.22]
    microwave_y: 0.18
    microwave_x_range: [-0.42, -0.22]
    station_side: random
    station_x: -0.08
    station_x_range: [-0.20, -0.02]
    station_x_range_left: [-0.22, -0.04]
    station_x_range_right: [0.04, 0.22]
    disp_y: 0.08
    disp_y_jitter: 0.06
    jar_y: -0.06
    jar_start_gap: 0.025
    scale_x: -0.32
    scale_y: -0.14
    scale_dist: 0.25
    scale_dist_jitter: 0.10
    scale_near_dx_range: [-0.28, -0.16]
    scale_near_dy_range: [-0.12, -0.02]
    decor_on_microwave_prob: 0.35
    bread_xy: [0.28, -0.20]
    flour_xy: [0.38, 0.14]
    chips_xy: [0.12, -0.22]
    bowl_xy: [0.40, -0.02]
    board_scale_mult: 0.091     # +30% cutting board
    microwave_scale_mult: 1.3   # +30% microwave
  pour_beer:
    scene_id: 0
    randomize_layout: true
    station_side: random
    station_x: 0.10
    cup_y: -0.08
    tap_dy: 0.12
    tap_y_down: 0.10
    station_x_range_left: [-0.16, -0.06]
    station_x_range_right: [0.06, 0.16]
    station_x_range: [0.06, 0.16]
    pour_rate: 0.000715
    foam_gain_start: 0.18
    foam_gain: 0.85
    foam_ramp_steps: 70
    foam_decay: 0.0045
    tap_settle_sec: 1.0
    open_gap_timeout_sec: 5.0
    expert_foam_pause: 0.16
    expert_foam_resume: 0.09
    target_liquid: 0.90
    safe_total: 0.96
    full_liquid_tol: 0.05
  clean_table:
    # Per-seed layout: laptop L/R, mug 15–20 cm gap, spill ±30% speed, décor band.
    randomize_layout: true
    laptop_side: random
    force_side: false
    mug_side: random
    laptop_x: 0.20
    laptop_y: -0.02
    mug_laptop_gap_min: 0.30
    mug_laptop_gap_max: 0.40
    mug_y_min: -0.10
    mug_y_max: 0.50
    mug_x: 0.20
    mug_y: -0.02
    sponge_y: -0.18
    sponge_dx: 0.12
    sponge_grasp_open: 1.0
    sponge_grasp_close: 0.25
    mug_id: 0
    mug_scale_mult: 0.60
    laptop_id: 0
    spill_steps: 3667
    spill_speed_jitter: 0.30
    reach_laptop_level: 0.92
    clean_tol: 0.08
    post_tip_wait: 40
    expert_wipe_level: 0.20
    initial_puddle_level: 0.22
    spot_contact_extra: 0.004
    spot_clear_dwell: 6
    wipe_safe_z: 0.11
    mug_avoid_margin: 0.025
