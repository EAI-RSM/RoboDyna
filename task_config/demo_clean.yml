# if you want to modify the config, please check the following tutorial first:
# https://robotwin-platform.github.io/doc/usage/configurations.html
render_freq: 0
episode_num: 1
use_seed: false
save_freq: 15
embodiment: [aloha-agilex]
language_num: 100
domain_randomization:
  random_background: false
  cluttered_table: false
  clean_background_rate: 1
  random_head_camera_dis: 0
  random_table_height: 0
  random_light: false
  crazy_random_light_rate: 0
camera:
  head_camera_type: D435
  wrist_camera_type: D435
  collect_head_camera: true
  collect_wrist_camera: true
data_type:
  rgb: true
  third_view: false
  depth: false
  pointcloud: false
  observer: false
  endpose: true
  qpos: true
  mesh_segmentation: false
  actor_segmentation: false
pcd_down_sample_num: 1024
pcd_crop: true
save_path: ./data
clear_cache_freq: 1
collect_data: true
eval_video_log: true
# Task-scoped knobs (read by envs that look under task_args.<task_name>).
task_args:
  fill_coffee_jar:
    # Success = fill in [target_fill ± fill_tol]. target_fill: 0.25|0.5|0.75|random
    # Peak button press force → beans dispensed → fill level (beans/beans_full).
    target_fill: random
    scene_id: 0
    randomize_layout: true
    beans_full: 160                              # rim = 100% fill
    force_thresholds: [3.0, 6.0, 10.0, 14.0]   # N  (light → hard)
    beans_per_force_level: [10, 20, 30, 40]     # → ~6%/13%/19%/25% fill
    force_stiffness: 300.0                       # N/m spring engagement proxy
    force_engage_slack: 0.05                     # m above button where force starts
    press_depths: [0.020, 0.030, 0.044, 0.057]  # expert depths for levels 1–4
    press_sample_s: 0.40
    fill_tol: 0.05                               # ±5% success band
  measure_ingredient:
    # Pour oil to target ring, then place jar on electronic scale.
    target_fill: 0.25
    fill_levels: [0.25, 0.50, 0.75, 1.0]
    scene_id: 0
    pour_rate: 0.00022
    # Sample fill speed ∼ Uniform(1±pour_rate_jitter) * pour_rate (0 = fixed).
    pour_rate_jitter: 0.15
    fill_tol: 0.05
    # oil_style: solid (opaque sunflower yellow) | transparent (see-through amber)
    oil_style: solid
    scale_id: 0
    randomize_layout: false
    microwave_y: 0.18
    microwave_x_range: [-0.42, -0.22]
    station_x: -0.08
    station_x_range: [-0.20, -0.02]
    disp_y: 0.08
    jar_y: -0.06
    scale_x: -0.32
    scale_y: -0.14
    scale_near_dx_range: [-0.28, -0.16]
    scale_near_dy_range: [-0.12, -0.02]
    decor_on_microwave_prob: 0.35
    bread_xy: [0.28, -0.20]
    flour_xy: [0.38, 0.14]
    chips_xy: [0.12, -0.22]
    bowl_xy: [0.40, -0.02]
    board_scale_mult: 0.091     # +30% cutting board
    microwave_scale_mult: 1.3   # +30% microwave
  pour_beer:
    scene_id: 0
    bottle_beer_frac: 0.90
    pour_rate: 0.004
    foam_gain: 1.8
    foam_decay: 0.0035
    expert_foam_stop: 0.82
    expert_foam_resume: 0.55
    target_liquid: 0.90
    full_liquid_tol: 0.05
  clean_table:
    # Mug on one side, 015_laptop opposite; irregular spill from rim toward laptop.
    mug_side: right
    mug_x: 0.20
    laptop_x: 0.20
    mug_y: -0.02
    laptop_y: -0.02
    sponge_y: -0.16
    mug_id: 0
    mug_scale_mult: 0.60
    laptop_id: 0
    spill_steps: 7500
    reach_laptop_level: 0.88
    clean_tol: 0.08
    post_tip_wait: 180
    expert_wipe_level: 0.12
    spot_contact_extra: 0.020
    spot_clear_dwell: 8
