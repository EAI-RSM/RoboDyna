# clean_table — dual UR5e + WSG (ur5-wsg).
render_freq: 0
episode_num: 1
use_seed: false
save_freq: 15
embodiment: [ur5-wsg, ur5-wsg, 0.6]
language_num: 100
use_dynamic: false
dynamic_level: 1
dynamic_coefficient: 0.1
domain_randomization:
  random_background: false
  cluttered_table: false
  clean_background_rate: 1
  random_head_camera_dis: 0
  random_table_height: 0
  random_light: false
  crazy_random_light_rate: 0
camera:
  head_camera_type: D435
  wrist_camera_type: D435
  collect_head_camera: true
  collect_wrist_camera: true
data_type:
  rgb: true
  third_view: false
  depth: false
  pointcloud: false
  observer: false
  endpose: true
  qpos: true
  mesh_segmentation: false
  actor_segmentation: false
pcd_down_sample_num: 1024
pcd_crop: true
save_path: ./data
clear_cache_freq: 1
collect_data: true
eval_video_log: true
save_failed_cases: false
check_render_success: true
task_args:
  clean_table:
    # Per-seed layout / spill / décor diversification (default on).
    randomize_layout: true
    # left | right | random — with randomize_layout, side is coin-flipped unless
    # force_side: true locks this value.
    laptop_side: random
    force_side: false
    # Legacy mug_side still accepted (inverted to laptop_side when laptop_side unset).
    mug_side: random
    # Base laptop pose (mirrored ±X); jittered ±20% X / ±30% Y when randomizing.
    laptop_x: 0.20
    laptop_y: -0.02
    # Center-to-center X gap (meters), randomized per seed. Tip/spill mug → laptop.
    mug_laptop_gap_min: 0.30
    mug_laptop_gap_max: 0.40
    mug_y_min: -0.10
    mug_y_max: 0.50
    # Deterministic fallbacks used only when randomize_layout: false.
    mug_x: 0.20
    mug_y: -0.02
    sponge_y: -0.18
    mug_id: 0
    mug_scale_mult: 0.60
    laptop_id: 0
    laptop_yaw: 1.5707963267948966   # +90° Z — screen/keyboard toward robot (−Y)
    sponge_dx: 0.12                  # offset away from laptop (not in spill corridor)
    sponge_grasp_open: 1.0
    sponge_grasp_close: 0.25
    # Lower = faster spread; per-seed rate also jitters by spill_speed_jitter.
    spill_steps: 3667
    spill_speed_jitter: 0.30         # ±30% of configured spill rate
    reach_laptop_level: 0.92
    clean_tol: 0.08
    # Tip reveals a multi-spot puddle immediately; short settle then dab each lobe.
    post_tip_wait: 40
    expert_wipe_level: 0.20
    initial_puddle_level: 0.22
    spot_contact_extra: 0.004
    spot_clear_dwell: 6
    wipe_safe_z: 0.11
    mug_avoid_margin: 0.025
    # Décor defaults (used when randomize_layout: false); otherwise sampled in the
    # upper 30% of table Y with non-overlap rejection.
    decor_y: 0.24
    plant_x: -0.44
    plant_scale: 0.55
    file_x: 0.02
    pencup_x: 0.40
    clock_x: -0.18
    clock_scale: 0.60
