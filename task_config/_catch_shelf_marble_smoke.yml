render_freq: 0
episode_num: 1                 # smoke test
use_seed: false
save_freq: 15
embodiment: [aloha-agilex] #[ur5-wsg, ur5-wsg, 0.6]
language_num: 100
use_dynamic: false            # static path by default; tasks with a moving element flip this themselves
dynamic_level: 1              # dynamic complexity level(1,2,3)
dynamic_coefficient: 0.1      # dynamic coefficient
domain_randomization:
  random_background: false
  cluttered_table: false
  clean_background_rate: 1
  random_head_camera_dis: 0
  random_table_height: 0
  random_light: false
  crazy_random_light_rate: 0
camera:
  head_camera_type: D435
  wrist_camera_type: D435
  collect_head_camera: true
  collect_wrist_camera: true
data_type:
  rgb: true
  third_view: false
  depth: false
  pointcloud: false
  observer: false
  endpose: true
  qpos: true
  mesh_segmentation: false
  actor_segmentation: false
pcd_down_sample_num: 1024
pcd_crop: true
save_path: ./data
clear_cache_freq: 5
collect_data: true
eval_video_log: true
check_render_success: false   # debug: don't filter render-pass successes
# ---- LeRobot v2.1 export (inline, written alongside the HDF5/mp4 into one combined suite dataset) ----
export_lerobot: true
lerobot_root: ./data_lerobot/domino_suite
lerobot_chunks_size: 1000
lerobot_task_state_dim: 32
save_failed_cases: true       # debug: save every attempt (with its success flag) so a not-yet-fixed task's job always TERMINATES instead of looping seeds forever
# ---------------------------------------------------------------------------
# DEBUG mirror of demo_dynamic.yml: same per-task params, smaller batch + save-failed
# so jobs terminate while tuning. Invoke as `collect_data.sh <task> debug_dynamic 0`.
# Keep this task_args block in sync with demo_dynamic.yml.
# ---------------------------------------------------------------------------
task_args:
  toast_bread:
    toast_steps: 300
    target_doneness: 0.45
    plate_scale_mult: 0.65
    steamer_scale_mult: 0.10
  cook_meat:
    cook_steps: 1000
    target_doneness: 0.5
  assemble_markers_cylinder:
    side_cyl_radius: 0.018
    side_cyl_half_len: 0.10
    center_cyl_radius: 0.09
    center_cyl_half_len: 0.10
    center_x: 0.0
    center_y: 0.0
    attach_dist: 0.06
    attach_z: 0.04
    dwell_steps: 40
    side_group_x_offset: 0.18
    side_group_y_offset: 0.10
    side_group_x_jitter: 0.02
    side_group_y_jitter: 0.008
    center_table_clearance: 0.005
    rotation_direction: counter_clockwise
  catch_marbles_trapdoors:
    press_hold_steps: 24
    final_dwell_steps: 100
    button_press_depth: 0.03
    door_open_angle_deg: 95.0
    door_open_speed_deg: 220.0
    ball_speed: 0.18
    ball_bounce_height: 0.012
  catch_rat:
    num_appearances: 3
    pop_steps: 90
    grasp_tol: 0.05
  whack_a_mole:
    num_moles: 4
    num_distractors: 0        # white rabbit distractors (0..M, M=4); touching one fails
    difficulty: easy
    pop_steps: 90
    touch_tol: 0.04
    hole_count: 9
    hole_size: 0.0825         # 1.5x former openings
    hole_bar_thickness: 0.014
    cube_hole_scale: 1.20     # blue mallet cube side = hole_size * scale (>1 so it can't enter)
    cube_grasp_drop_z: 0.05   # lower cube 5 cm below finger midpoint
    mole_scale_mult: 1.80     # 1.5x prior mole size
    mole_height: 0.1053       # world height after mole_scale_mult
    rabbit_scale_mult: 2.40   # match enlarged mole world height
    rabbit_height: 0.1053
    table_height_bias: 0.05   # raise table (+board) 5 cm
    board_z_lift: 0.12        # play surface ~12 cm above table; solid base sits on table
    board_color: [0.98, 0.82, 0.05]  # yellow
  collect_falling_bowl:
    num_objects: 4
    emit_interval: 40
    fall_steps: 55
    rim_radius: 0.055
    pour_every: 3
  cup_curtain_slot:
    curtain_freq: 0.8
    curtain_amp: 0.05
    belt_speed: 0.04
    belt_range: 0.06
    placement_tol: 0.07
    gap_tol: 0.06
    reach_tol: 0.07
  dual_hole_punch:
    n_pages: 4
    punch_tol: 0.035
    belt_inward_reach: 0.13
    belt_outward_scale: 2.0
    equal_tile_spacing: true
    belt_speed: 0.2
    belt_continous_motion: true
    missing_tile_mode: true
    tile_pause_steps: 28
    square_gap: 0.015
    square_gap_min: 0.010
    square_gap_max: 0.030
  dispense_gummy:
    tube_capacity: 4
    difficulty_option: 1  # 1: uneven yellow/blue counts; 2: uneven yellow counts with empty gaps
    target_color: yellow
    ball_diameter: 0.03
    ball_slot_gap: 0.003
    tube_inner_radius: 0.017
    tube_wall_thickness: 0.003
    tube_bottom_z_offset: 0.075
    tube_center_y: 0.03
    tube_x_left: -0.06
    tube_x_right: 0.06
    bowl_radius: 0.06
    bowl_align_tol: 0.035
    bowl_catch_z_tol: 0.025
    belt_thickness: 0.015
    belt_move_steps: 30
    belt_key_x: 0.26
    belt_key_y_left: -0.14
    belt_key_y_right: -0.06
    key_x: -0.26
    key_y: -0.13
    dispense_steps: 20
    press_hold_steps: 5
    post_press_dwell: 8
  catch_shelf_marble:
    n_shelves: 4
    shelf_length: 0.20
    level_gap: 0.13
    tilt_min_deg: 15.0        # randomized per-shelf tilt magnitude range (degrees); direction is
    tilt_max_deg: 45.0        # separately tied to each shelf's zig-zag offset, see load_actors
    bottom_clearance: 0.22
    ball_radius: 0.014
    roll_speed: 0.35
    reactive_marble: false    # if true: marble drops at play_once start instead of on key-press
    reactive_roll_speed: 0.09 # slide speed used only when reactive_marble is true (see docstring)
    bowl_radius: 0.05
    bowl_speed: 0.18
    bowl_catch_xy_tol: 0.035
    key_x_left: -0.26
    key_x_right: 0.26
    key_y: -0.13
  goalkeeper:
    ball_speed_min: 0.07
    ball_speed_max: 0.09
    ball_angle_deg_min: -10.0
    ball_angle_deg_max: 10.0
    goal_center_y: 0.10
    goal_center_y_jitter: 0.0
    green_area_x_len: 0.10
    green_area_y_extra: 0.05
    red_line_x: 0.06
    goal_x: 0.20
    keeper_x: 0.16
    keeper_goal_clearance: 0.05
    keeper_pose_tol: 0.03
  pick_cup_behind_fan:
    fan_omega_deg: 2.0
    gap_frac: 0.40
    theta_spill: 35.0
    fan_far_y: 0.12
  pick_ripe_apple:
    ripen_steps: 2500   # slow ripening: apple stays ~red through the grasp
    red_window_min: 0.48   # per-episode red target band (like cook_meat doneness)
    red_window_max: 0.52
    red_tolerance: 0.12
  place_block_belt:
    belt_speed: 0.06
    theta_max_deg: 30.0
    belt_ride_steps: 600
  rotating_shape_sorter:
    spin_speed: 0.9
    r_tol: 0.06
    align_window: 0.18
    max_track_steps: 900
  sort_apples_belt:
    n_apples: 10
    belt_speed: 0.012
    belt_speed_scale: 1.0
    advance_every: 4
    gate_default_left: true
  hit_target:
    board_half_size: 0.075
    center_half_size: 0.018
    sway_amp: 0.10
    sway_period: 900
    target_speed: 1.0
    target_y_offset: 0.050
    motion_x_min: 0.03
    motion_x_max: 0.24
    target_center_x_min: 0.12
    target_center_x_max: 0.15
    blocker_enabled: false
    blocker_dynamic: false
    blocker_radius: 0.040
    blocker_thickness: 0.002
    blocker_y_gap: 0.050
    blocker_z_offset: 0.0
    blocker_x_offset: 0.0
    blocker_speed_min: 0.70
    blocker_speed_max: 1.45
    blocker_speed_min_delta: 0.10
  ring_on_moving_peg:
    r_ring: 0.028
    catch_r: 0.07
    period: 3000
    amp_x: 0.010
    amp_y: 0.025
    amp_z: 0.018
  quality_control:
    n_tiles: 6
    color_mode: alternating   # alternating | random (non-black tiles)
    spacing_mode: random      # equal | random inter-tile gaps
    tile_spacing: 0.08
    spacing_min: 0.07
    spacing_max: 0.14
    black_frac_max: 0.50      # randomly blacken up to this fraction; no key on black
  packing:
    n_per_color: 3
    spawn_mode: parallel      # single | parallel; next wave after drop or belt-exit
    spawn_delay_s: 2.0        # unused (compat)
    belt_gap: 0.10
    belt_speed: 0.0008
    # belt_speed_left: 0.0008
    # belt_speed_right: 0.0012
    advance_every: 3
    spawn_gap: 0.16
    pick_y: 0.24
    pick_y_end: -0.16
    pick_station_y: 0.02
    fruit_scale: 0.80
    basket_y: 0.0
    basket_x: 0.34
    basket_scale: 1.15
  two_type_sorting_catch:
    num_objects: 4
    fall_steps: 90
    lateral_bias: 0.16
    center_rate: 0.25
    catch_tol: 0.07
  catch_ramp_ball:
    ramp_angle: 0.24
    ball_radius: 0.018
    rim_radius: 0.04
    x_span: 0.15
    roll_time_min: 5.0      # s; kinematic roll(t1)+fall lasts ~10-20s
    roll_time_max: 20.0
    fall_time: 0.5          # s; short accelerating drop off the edge
    idle_time_min: 2.0      # s; robot stays still before grasping
    idle_time_max: 4.0
    settle_steps: 70
  catch_valley_ball:
    ramp_half_width: 0.125
    ramp_thickness: 0.012
    ramp_center_y: 0.08
    ramp_valley_x: -0.02
    ramp_valley_height: 0.025
    down_run: 0.27
    down_rise: 0.13
    up_run: 0.20
    up_rise: 0.055
    curve_segments: 16
    rail_height: 0.055
    ball_radius: 0.018
    drop_height: 0.14
    drop_time: 0.60
    ball_path_mode: random   # straight, angled, or random
    angled_path_min_deg: 15.0
    angled_path_max_deg: 25.0
    drop_forward_angle_min_deg: -8.0
    drop_forward_angle_max_deg: 12.0
    initial_forward_speed_min: 0.90
    initial_forward_speed_max: 1.10
    physics_max_steps: 1200
    red_line_gap: 0.10
    roll_time_min: 4.0
    roll_time_max: 7.0
    roll_acceleration: 0.35
    launch_speed: 0.72
    idle_time_min: 1.0
    idle_time_max: 2.0
    settle_steps: 150
    bowl_id: 1
    bowl_scale_mult: 0.65
    bowl_inner_radius: 0.028
    bowl_outer_radius: 0.037
    bowl_height: 0.040
  play_billiard:
    pocket_mode: any          # any | top_three
    blocker_mode: none        # none | path_to_top | unused_tops
    num_extra_balls: 0        # 0–2
    ball_radius: 0.012
    table_cx: 0.0
    table_cy: 0.1
    table_half_len: 0.22
    table_half_wid: 0.14
    settle_steps: 500
    strike_impulse: 0.55
