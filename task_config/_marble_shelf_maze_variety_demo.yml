render_freq: 0
episode_num: 6
use_seed: false
save_freq: 15
embodiment: [ur5-wsg, ur5-wsg, 0.6]
language_num: 100
use_dynamic: true
dynamic_level: 1
dynamic_coefficient: 0.1
domain_randomization:
  random_background: false
  cluttered_table: false
  clean_background_rate: 1
  random_head_camera_dis: 0
  random_table_height: 0
  random_light: false
  crazy_random_light_rate: 0
camera:
  head_camera_type: D435
  wrist_camera_type: D435
  collect_head_camera: true
  collect_wrist_camera: true
data_type:
  rgb: true
  third_view: false
  depth: false
  pointcloud: false
  observer: false
  endpose: true
  qpos: true
  mesh_segmentation: false
  actor_segmentation: false
pcd_down_sample_num: 1024
pcd_crop: true
save_path: ./tmp_marble_shelf_maze_variety
clear_cache_freq: 1
collect_data: true
eval_video_log: true
check_render_success: false
export_lerobot: false
lerobot_root: ./data_lerobot/domino_suite
lerobot_chunks_size: 1000
lerobot_task_state_dim: 32
task_args:
  marble_shelf_maze:
    n_shelves_min: 4
    n_shelves_max: 6
    shelf_length: 0.18
    glass_gap: 0.05
    shelf_half_depth: 0.0125
    shelf_half_thick: 0.00625
    level_gap: 0.055
    level_gap_jitter: 0.35
    overlap_min: 0.30
    overlap_max: 0.75
    bottom_clearance: 0.15
    ball_radius: 0.012
    roll_off_speed: 0.06
    continuous_ball_motion: false
    continuous_ball_speed_scale: 0.40
    continuous_tilt_duration_scale: 1.50
    oscillating_bowl_enabled: false
    oscillating_bowl_period: 3.0
    button_x: [-0.18, 0.18]
    tilt_angle_deg: 45.0
    tilt_duration_sec: 0.5
    smooth_tilt: false
    tilt_speed_deg_per_sec: 30.0
    fall_settle_steps: 160
    final_fall_settle_steps: 220
    button_press_depth: 0.03
    press_hold_steps: 20
    post_press_dwell: 10
    bowl_scale_mult: 0.65
    bowl_catch_radius: 0.032
