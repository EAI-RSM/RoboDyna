render_freq: 0
episode_num: 2
use_seed: false
save_freq: 15
embodiment: [ur5-wsg, ur5-wsg, 0.6] #[aloha-agilex] #
language_num: 100
use_dynamic: true            # static path by default; tasks with a moving element flip this themselves
dynamic_level: 1              # dynamic complexity level(1,2,3)
dynamic_coefficient: 0.1      # dynamic coefficient
domain_randomization:
  random_background: false
  cluttered_table: false
  clean_background_rate: 1
  random_head_camera_dis: 0
  random_table_height: 0
  random_light: false
  crazy_random_light_rate: 0
camera:
  head_camera_type: D435
  wrist_camera_type: D435
  collect_head_camera: true
  collect_wrist_camera: true
data_type:
  rgb: true
  third_view: true
  depth: false
  pointcloud: false
  observer: false
  endpose: true
  qpos: true
  mesh_segmentation: false
  actor_segmentation: false
pcd_down_sample_num: 1024
pcd_crop: true
save_path: ./data
clear_cache_freq: 1
collect_data: true
eval_video_log: true
check_render_success: false
save_failed_cases: true  # only filter on plan-pass success; flip to true for a double-verified production set
# ---- LeRobot v2.1 export (inline, written alongside the HDF5/mp4 into one combined suite dataset) ----
export_lerobot: true
lerobot_root: ./data_lerobot/domino_suite
lerobot_chunks_size: 1000
lerobot_task_state_dim: 32
# ---------------------------------------------------------------------------
# Per-task params, namespaced by task name. This is the SHARED config for the
# whole suite: invoke as `collect_data.sh <task> demo_dynamic 0` -- the task arg
# selects which block below is read (kwags["task_args"][<task>]); all other tasks'
# blocks are ignored. (debug_dynamic.yml mirrors this block with debug run knobs.)
# ---------------------------------------------------------------------------
task_args:
  toast_bread:
    toast_steps: 1000
    target_doneness: 0.45
    plate_scale_mult: 0.65
    steamer_scale_mult: 0.10
  cook_meat:
    cook_steps: 5000            # nominal steps for doneness 0→1.0
    cook_speed_jitter: 0.20     # Default: per-ep cook_steps ~ U(nom×(1±jitter))
    cook_button_enabled: false  # default = contact cook; Opt 1 = true
    dual_setup_enabled: false
    target_doneness_min: 0.45 # tight band around medium
    target_doneness_max: 0.55
    place_dx: 0.010           # center the steak in the bowl (+x)
    place_dy: -0.015          # center the steak in the bowl (-y)
  assemble_markers_cylinder:
    side_cyl_radius: 0.018
    side_cyl_half_len: 0.10
    center_cyl_radius: 0.09
    center_cyl_half_len: 0.10
    center_x: 0.0
    center_y: 0.0
    attach_dist: 0.06
    attach_z: 0.04
    dwell_steps: 40
    side_group_x_offset: 0.18
    side_group_y_offset: 0.10
    side_group_x_jitter: 0.03
    side_group_y_jitter: 0.01
    center_table_clearance: 0.005
    rotation_direction: counter_clockwise
  catch_marbles_trapdoors:
    press_hold_steps: 24
    final_dwell_steps: 100
    button_press_depth: 0.03
    door_open_angle_deg: 95.0
    door_open_speed_deg: 220.0
    ball_speed: 0.18
    ball_bounce_height: 0.012
  marble_shelf_maze:
    n_shelves: 4
    shelf_length: 0.18
    glass_gap: 0.05
    shelf_half_depth: 0.0125
    shelf_half_thick: 0.00625
    level_gap: 0.055
    level_gap_jitter: 0.35
    overlap_min: 0.30
    overlap_max: 0.75
    bottom_clearance: 0.15
    ball_radius: 0.012
    roll_off_speed: 0.06
    continuous_ball_motion: false
    continuous_ball_speed_scale: 0.40
    continuous_tilt_duration_scale: 1.50
    oscillating_bowl_enabled: false
    oscillating_bowl_period: 3.0
    tilt_angle_deg: 45.0
    tilt_duration_sec: 0.5
    smooth_tilt: false
    tilt_speed_deg_per_sec: 30.0
    fall_settle_steps: 160
    final_fall_settle_steps: 220
    button_x: [-0.18, 0.18]
    button_press_depth: 0.03
    press_hold_steps: 20
    post_press_dwell: 10
    bowl_scale_mult: 0.65
    bowl_catch_radius: 0.032
  catch_rat:
    # Option 1: two mice from opposite holes; success requires both held.
    catch_two_mice: false
    # Option 2: opaque colored top lattice (false = glass / see-through).
    opaque_surface: false
    # Per-episode rise/fall speed (m/s), sampled uniformly in [min, max].
    rat_move_speed_min: 0.04
    rat_move_speed_max: 0.10
    num_appearances: 3
    pop_steps: 90
    grasp_tol: 0.05
  whack_a_mole:
    num_moles: 2
    distractor_enabled: false
    num_distractors: 1
    relocating_moles: false
    difficulty: easy          # easy = one mole at a time; hard = two simultaneous (both arms)
    pop_steps: 90
    touch_tol: 0.04
    hole_count: 9
    hole_size: 0.0825         # 1.5x former openings
    hole_bar_thickness: 0.014
    cube_hole_scale: 1.20     # blue mallet cube side = hole_size * scale (>1 so it can't enter)
    cube_grasp_drop_z: 0.05   # lower cube 5 cm below finger midpoint
    mole_scale_mult: 1.80     # 1.5x prior mole size
    mole_height: 0.1053       # world height after mole_scale_mult
    rabbit_scale_mult: 1.00   # match enlarged mole world height
    rabbit_height: 0.1047
    table_height_bias: 0.05   # raise table (+board) 5 cm
    board_z_lift: 0.06        # play surface ~6 cm above table; compact base sits on table
    board_color: [0.98, 0.82, 0.05]  # yellow
  collect_falling_bowl:
    num_objects: 4
    emit_interval: 40
    fall_steps: 55
    rim_radius: 0.055
    pour_every: 3
  cup_curtain_slot:
    curtain_freq: 0.5
    curtain_amp: 0.05
    belt_speed: 0.08
    belt_range: 0.08
    placement_tol: 0.05
    gap_tol: 0.06
    reach_tol: 0.05
    moving_component_spacing: 0.10
    blue_curtains_enabled: false      # opt1
    blue_curtain_dynamic_enabled: false  # opt2
    lift_off_only_after_place: false
    post_place_lift_z: 0.10
  dual_hole_punch:
    # Opt 1 missing_tile_mode | Opt 2 belt_continous_motion (spacing always variable)
    # DEFAULT Opt 2 false = discrete; Opt 1 = alternate 1- vs 2-arm punches
    n_pages: 4
    punch_tol: 0.035
    belt_inward_reach: 0.13
    belt_outward_scale: 2.0
    belt_speed: 0.0002
    belt_continous_motion: false
    missing_tile_mode: false
    tile_pause_s: 2.0
    square_gap_min: 0.010
    square_gap_max: 0.030
  dispense_gummy:
    tube_capacity: 4
    layout_mode: alternating
    belt_continuous_motion: false
    bowl_speed: 0.15
    belt_speed_jitter: 0.20
    target_color: yellow
    ball_diameter: 0.03
    ball_slot_gap: 0.003
    tube_inner_radius: 0.017
    tube_wall_thickness: 0.003
    tube_bottom_z_offset: 0.075
    tube_center_y: 0.03
    tube_x_left: -0.06
    tube_x_right: 0.06
    bowl_radius: 0.06
    bowl_align_tol: 0.035
    bowl_catch_z_tol: 0.025
    belt_thickness: 0.015
    belt_move_steps: 30
    belt_key_x: 0.26
    belt_key_y_left: -0.14
    belt_key_y_right: -0.06
    key_x: -0.26
    key_y: -0.13
    dispense_steps: 24
    press_hold_steps: 6
    post_press_dwell: 10
  catch_shelf_marble:
    # Options (independent toggles; Opt 1+2 can both be on):
    #   Default — marble pauses on the top shelf until a bowl key is pressed
    #   Opt 1 — reactive_marble: marble starts moving/falling from episode start
    #   Opt 2 — oscillating_shelf_enabled: one random non-top shelf sweeps -x..+x
    n_shelves_min: 4          # per-episode randomized shelf count (set n_shelves to pin a fixed count)
    n_shelves_max: 7
    shelf_length: 0.20
    stack_height: 0.39        # total bottom-to-top-shelf span; level_gap = stack_height/(n_shelves-1)
    tilt_min_deg: 15.0        # randomized per-shelf tilt magnitude range (degrees); direction is
    tilt_max_deg: 45.0        # independently randomized per shelf, see load_actors
    bottom_clearance: 0.22
    ball_radius: 0.014
    roll_speed: 0.35          # non-reactive / Default slide speed
    reactive_marble: false    # Opt 1: true = marble drops at play_once start (not on key-press)
    reactive_roll_speed: 0.09 # Opt 1: slide speed used only when reactive_marble is true
    oscillating_shelf_enabled: false  # Opt 2: one random non-top shelf sweeps -x..+x
    bowl_radius: 0.05
    bowl_speed: 0.18
    bowl_catch_xy_tol: 0.035
    key_x_left: -0.26
    key_x_right: 0.26
    key_y: -0.13
  goalkeeper:
    ball_speed_min: 0.07
    ball_speed_max: 0.09
    ball_angle_deg_min: -10.0
    ball_angle_deg_max: 10.0
    goal_center_y: 0.05
    goal_center_y_jitter: 0.0
    green_area_x_len: 0.10
    green_area_y_extra: 0.05
    red_line_x: 0.2
    goal_x: 0.30
    keeper_x: 0.16
    keeper_goal_clearance: 0.05
    keeper_pose_tol: 0.03
  pick_cup_behind_fan:
    fan_omega_deg: 2.0
    gap_frac: 0.40
    theta_spill: 35.0
    fan_far_y: 0.12
  pick_ripe_apple:
    ripen_steps: 2500   # slow ripening: apple stays ~red through the grasp
    red_window_min: 0.48   # per-episode red target band (like cook_meat doneness)
    red_window_max: 0.52
    red_tolerance: 0.12
  place_block_belt:
    belt_speed: 0.06
    theta_max_deg: 30.0
    belt_ride_steps: 600
  rotating_shape_sorter:
    spin_speed: 1.9
    r_tol: 0.06
    align_window: 0.18
    max_track_steps: 900
  load_train:
    rail_radius: 0.20
    train_omega_min: 0.10
    train_omega_max: 0.18
    n_wagons: 3
    target_wagon_mode: false
    ball_side: random
    ball_lateral_min: 0.07
    ball_lateral_max: 0.12
    ball_y_jitter: 0.02
    ball_radius: 0.015
    car_floor_h: 0.014
    car_half_len: 0.045
    car_half_wid: 0.040
    car_arc_spacing: 0.10
    car_wall_h: 0.036
    ball_side_clearance: 0.11
    release_clearance_z: 0.20
    transport_clearance_z: 0.22
    pass_angle_offset: 0.22
    align_tol: 0.055
    release_open_steps: 300
    post_release_steps: 500
    catch_radius: 0.055
    drop_reach_tol: 0.030
    latch_z_max: 0.015
    latch_settle_steps: 12
    tunnel_enabled: true
    tunnel_prob: 1.0
    tunnel_n_wagons_min: 2
    tunnel_n_wagons_max: 4
    tunnel_center_jitter: 0.40
  sort_apples_belt:
    n_apples_min: 4          # RANDOM apple count per episode
    n_apples_max: 10
    belt_speed_min: 0.0005   # RANDOM steady belt speed per episode (~0.03-0.06 m/s, constant flow)
    belt_speed_max: 0.0010
    belt_speed_scale: 1.0
    advance_every: 4
    gate_default_left: true
    color_mode: alternating  # Opt1: random; Opt2: rotten_prob>0
    rotten_prob: 0.0
  hit_target:
    board_half_size: 0.075
    center_half_size: 0.018
    sway_amp: 0.10
    sway_period: 900
    target_speed: 1.0
    target_y_offset: 0.050
    motion_x_min: 0.03
    motion_x_max: 0.24
    target_center_x_min: 0.12
    target_center_x_max: 0.15
    blocker_enabled: true
    blocker_dynamic: true
    blocker_radius: 0.040
    blocker_thickness: 0.002
    blocker_y_gap: 0.050
    blocker_z_offset: 0.0
    blocker_x_offset: 0.0
    blocker_speed_min: 0.70
    blocker_speed_max: 1.45
    blocker_speed_min_delta: 0.10
  ring_on_moving_peg:
    r_ring: 0.028
    catch_r: 0.07
    period: 3000
    amp_x: 0.010
    amp_y: 0.025
    amp_z: 0.018
  quality_control:
    # Default: color_mode=alternating, black_frac_max=0 (no distractors)
    # Opt 1: color_mode=random | Opt 2: black_frac_max>0 (e.g. 0.50)
    # tile_pause_s = max hold under stamp; miss unstamped red/green → fail
    n_tiles: 6
    color_mode: alternating
    spacing_mode: random
    tile_spacing: 0.08
    spacing_min: 0.07
    spacing_max: 0.14
    black_frac_max: 0.0
    tile_pause_s: 2.0
  packing:
    n_per_color: 3            # number of each colored fruit (apples + oranges)
    # n_apple: 3              # optional per-color override (falls back to n_per_color)
    # n_orange: 3
    spawn_mode: random        # single | parallel | random (aliases: opt1 | opt2 | opt3)
    # single: one fruit at a time; next spawns only after drop-in-basket or belt exit
    # parallel: one apple+orange wave; next wave only after both packed or left the belt
    # random: each wave randomly picks single (1 fruit) or pair (apple+orange) — count varies run to run
    spawn_delay_s: 2.0        # unused (compat); spawn is gated on drop / belt-exit
    belt_gap: 0.10            # gap between the two belts, centered at x=0
    belt_speed: 0.0008        # shared default speed (m per belt tick); both belts use this
    # belt_speed_left: 0.0008 # optional per-belt override (falls back to belt_speed)
    # belt_speed_right: 0.0012
    advance_every: 3          # physics steps between belt ticks
    spawn_gap: 0.16
    pick_y: 0.24              # start arm approach; fruit keeps rolling
    pick_y_end: -0.16         # past this, too late; fruit loops to far end
    pick_station_y: 0.02      # hover/grab line; fruit rolls through without pausing
    fruit_scale: 0.80         # larger fruit -> easier grasp
    basket_y: 0.0             # table midline (toward belts)
    basket_x: 0.34            # nudged out so the bigger basket clears the belts
    basket_scale: 1.15        # bigger opening — easier drop-in target
    pick_lift: 0.10           # hover clearance above the basket rim before releasing; bumped from 0.07 to compensate for the single-try move's typical undershoot (see PICK_LIFT comment in envs/packing.py) — do not raise further without re-checking for the ~0.11+ planner-overshoot regression
    pair_stagger_enabled: true  # pair waves ("parallel"/"random" modes): give one fruit a small head start so they don't ride in perfect lockstep
    pair_stagger_y: 0.045      # m; how much of a head start (kept well inside pick-window tolerances)
    single_wave_any_belt: true  # "random" mode: a single-fruit wave may appear on either belt (not just its color's dedicated one); packing arm/basket stay color-matched
  two_type_sorting_catch:
    num_objects: 4
    fall_steps: 90
    lateral_bias: 0.16
    center_rate: 0.25
    catch_tol: 0.07
  catch_ramp_ball:
    # Ramp meets back wall; drop-then-PhysX roll. Opt1 wall bounce, Opt2 blue distractor.
    ramp_angle: 0.24
    ramp_back_y: 0.395
    ramp_front_y: 0.02
    ball_radius: 0.018
    rim_radius: 0.04
    x_span: 0.15
    drop_height: 0.08
    drop_time: 0.45
    wall_bounce_enabled: false
    enable_distractor: false
    angled_path_min_deg: 20.0
    angled_path_max_deg: 40.0
    roll_speed: 0.15
    roll_speed_scale_min: 0.8
    roll_speed_scale_max: 1.2
    fall_time: 0.6
    idle_time_min: 1.5
    idle_time_max: 3.0
    settle_steps: 100
    physics_max_steps: 2500
    cup_fwd_clearance: 0.025
  catch_valley_ball:
    ramp_half_width: 0.125
    ramp_thickness: 0.012
    ramp_center_y: 0.08
    ramp_valley_x: -0.02
    ramp_valley_height: 0.025
    down_run: 0.27
    down_rise: 0.13
    up_run: 0.20
    up_rise: 0.055
    platform_length_scale_min: 0.8
    platform_length_scale_max: 1.2
    wall_bounce_enabled: false
    enable_distractor: false
    curve_segments: 16
    rail_height: 0.055
    ball_radius: 0.018
    drop_height: 0.14
    drop_time: 0.60
    ball_path_mode: straight   # straight, angled, or random
    angled_path_min_deg: 15.0
    angled_path_max_deg: 25.0
    drop_forward_angle_min_deg: -8.0
    drop_forward_angle_max_deg: 12.0
    initial_forward_speed_min: 0.90
    initial_forward_speed_max: 1.10
    physics_max_steps: 1200
    red_line_gap: 0.10
    roll_time_min: 4.0
    roll_time_max: 7.0
    roll_acceleration: 0.35
    launch_speed: 0.72
    idle_time_min: 1.0
    idle_time_max: 2.0
    settle_steps: 150
    bowl_id: 1
    bowl_scale_mult: 0.65
    bowl_inner_radius: 0.028
    bowl_outer_radius: 0.037
    bowl_height: 0.040
  play_billiard:
    # Default | Opt1 specific_hole | Opt2 enable_distractors | Opt1+2 both
    specific_hole: false
    enable_distractors: false
    num_extra_balls: 2      # when Opt2 on; 0 → sample 1–2
    ball_radius: 0.012
    # pocket diameter = 1.2 × ball diameter (omit to use that default)
    table_cx: 0.0
    table_cy: 0.1
    table_half_len: 0.22    # doubled playing surface
    table_half_wid: 0.14
    settle_steps: 500
    strike_impulse: 0.55
