render_freq: 0
episode_num: 1
use_seed: false
save_freq: 15
embodiment: [ur5-wsg, ur5-wsg, 0.6] #[aloha-agilex] #
language_num: 100
use_dynamic: true            # static path by default; tasks with a moving element flip this themselves
dynamic_level: 1              # dynamic complexity level(1,2,3)
dynamic_coefficient: 0.1      # dynamic coefficient
domain_randomization:
  random_background: false
  cluttered_table: false
  clean_background_rate: 1
  random_head_camera_dis: 0
  random_table_height: 0
  random_light: false
  crazy_random_light_rate: 0
camera:
  head_camera_type: D435
  wrist_camera_type: D435
  collect_head_camera: true
  collect_wrist_camera: true
data_type:
  rgb: true
  third_view: false
  depth: false
  pointcloud: false
  observer: false
  endpose: true
  qpos: true
  mesh_segmentation: false
  actor_segmentation: false
pcd_down_sample_num: 1024
pcd_crop: true
save_path: ./data
clear_cache_freq: 1
collect_data: true
eval_video_log: true
check_render_success: false  # only filter on plan-pass success; flip to true for a double-verified production set
# ---- LeRobot v2.1 export (inline, written alongside the HDF5/mp4 into one combined suite dataset) ----
export_lerobot: true
lerobot_root: ./data_lerobot/domino_suite
lerobot_chunks_size: 1000
lerobot_task_state_dim: 32
# ---------------------------------------------------------------------------
# Per-task params, namespaced by task name. This is the SHARED config for the
# whole suite: invoke as `collect_data.sh <task> demo_dynamic 0` -- the task arg
# selects which block below is read (kwags["task_args"][<task>]); all other tasks'
# blocks are ignored. (debug_dynamic.yml mirrors this block with debug run knobs.)
# ---------------------------------------------------------------------------
task_args:
  assemble_markers_cylinder:
    side_cyl_radius: 0.018      # m; graspable outer cylinder radius
    side_cyl_half_len: 0.10     # m; outer cylinder half-length
    center_cyl_radius: 0.09     # m; rotating center post radius
    center_cyl_half_len: 0.10   # m; center post half-height
    center_x: 0.0               # m; center post table x
    center_y: 0.0               # m; center post table y
    attach_dist: 0.06           # m; XY weld tolerance to attach target
    attach_z: 0.04              # m; Z weld tolerance to attach target
    dwell_steps: 40             # physics steps held at contact before release/weld
    side_group_x_offset: 0.18   # m; |x| of left/right side-cylinder groups
    side_group_y_offset: 0.10   # m; y of side-cylinder spawn groups
    side_group_x_jitter: 0.03   # m; per-ep uniform jitter on side-group x
    side_group_y_jitter: 0.01   # m; per-ep uniform jitter on side-group y
    center_table_clearance: 0.005  # m; gap under center post above table
    rotation_direction: counter_clockwise  # clockwise|cw | counter_clockwise|ccw|anticlockwise
  catch_marbles_trapdoors:
    press_hold_steps: 24        # steps to hold button depressed
    final_dwell_steps: 100      # post-success settle / observe steps
    button_press_depth: 0.03    # m; EE press depth into button
    door_open_angle_deg: 95.0   # deg; trapdoor open angle
    door_open_speed_deg: 220.0  # deg/s; trapdoor swing rate
    door_open_duration_sec: 0.5 # s; how long a door stays commanded open
    door_open_once: false       # opt1: true = each door opens only once then locks closed (default: unlimited)
    enable_distractor: false    # opt2: true = spawn black distractor marble (opposite direction)
    distractor_collide: false   # false = pass through, true = bounce on contact
    distractor_height_offset: 0.0  # m; keep 0 so distractor matches target marble height (Z)
    distractor_y_offset: 0.030  # m; parallel Y-lane separation so marbles do not collide
    distractor_speed: null      # m/s; null = sample ±20% around ball_speed (same as target)
    distractor_speed_scale_min: 0.8
    distractor_speed_scale_max: 1.2
    target_color: null          # null/random = pick 1 of 4 colors; or red|yellow|blue|green | 0..3
                                # matching left-side trapdoor → left arm; right-side → right arm
    shuffle_colors: true        # randomize left→right color order of doors + matching keys
    key_base_half: [0.032, 0.032, 0.005]  # larger/thinner black base under each colored keycap
    ball_speed: 0.18            # m/s; nominal marble speed; episode speeds sample ±20%
    ball_speed_scale_min: 0.8   # target marble speed low scale vs ball_speed
    ball_speed_scale_max: 1.2   # target marble speed high scale vs ball_speed
    ball_bounce_height: 0.012   # m; vertical bounce amplitude
  catch_ramp_ball:
    # Options (independent toggles; Opt 1+2 can both be on):
    #   Default — red ball drops at ramp top and rolls straight down
    #   Opt 1 — wall_bounce_enabled: lateral kick → side-rail rebound
    #     CLI: --task-arg wall_bounce_enabled=true   or   --option 1
    #   Opt 2 — enable_distractor: blue distractor on a separate lane
    #     (catching blue fails)
    #     CLI: --task-arg enable_distractor=true   or   --option 2
    # Ramp high end meets the white back wall (ramp_back_y ≈ 0.395).
    # Balls drop onto the top, then roll with a = g(sinθ − μ cosθ) scaled ~5× slower;
    # free-flight after the front lip uses PhysX (no lip freeze). Speeds sample
    # roll_speed × U(scale_min, scale_max) × BALL_SPEED_SCALE(0.2).
    ramp_angle: 0.12            # rad; gentle incline (moderate roll)
    ramp_back_y: 0.395          # m; high end world-y (meets back wall)
    ramp_front_y: 0.02          # m; low end world-y (catch side)
    ball_radius: 0.018          # m; ball radius
    rim_radius: 0.04            # m; cup catch XY tolerance
    x_span: 0.15                # m; ± playable lateral lane half-width
    drop_height: 0.08           # m; drop above ramp top surface
    drop_time: 0.45             # s; kinematic drop onto ramp top
    wall_bounce_enabled: false  # Opt 1
    enable_distractor: false    # Opt 2
    ball_path_mode: straight    # compat; overridden by wall_bounce_enabled
    angled_path_min_deg: 20.0   # deg; |wall rebound angle| low (Opt 1)
    angled_path_max_deg: 40.0   # deg; high
    roll_speed: 0.10            # m/s; pre-scale initial speed (effective ≈ 0.02)
    roll_speed_scale_min: 0.8   # per-ball speed low scale (±20%)
    roll_speed_scale_max: 1.2   # per-ball speed high scale
    fall_time: 0.55             # s; dwell budget after leaving the edge
    idle_time_min: 0.3          # s; short pause after drop before grasp
    idle_time_max: 0.6          # s; high
    settle_steps: 90            # physics steps after catch settle
    cup_fwd_clearance: 0.0      # m; unused (landing from ballistic exit)
    release_clearance: 0.055    # m; PhysX spawn past the front lip
    ramp_friction: 0.06         # kinetic μ on the incline
  catch_rat:
    # Option 1: two mice from opposite holes; success requires both held.
    catch_two_mice: false
    # Option 2: opaque colored top lattice (false = glass / see-through).
    opaque_surface: false
    # Per-episode rise/fall speed (m/s), sampled uniformly in [min, max].
    rat_move_speed_min: 0.04
    rat_move_speed_max: 0.10
    num_appearances: 3          # how many pop windows per episode
    pop_steps: 90               # sim steps rat stays raised per pop
    grasp_tol: 0.05             # m; catch offset scale (success uses ~2.5×)
  catch_shelf_marble:
    # Options (independent toggles; Opt 1+2 can both be on):
    #   Default — marble pauses on the top shelf until a bowl key is pressed
    #   Opt 1 — reactive_marble: marble starts moving/falling from episode start
    #     CLI: --task-arg reactive_marble=true   or   --option 1
    #   Opt 2 — oscillating_shelf_enabled: one random non-top shelf sweeps -x..+x
    #     CLI: --task-arg oscillating_shelf_enabled=true   or   --option 2
    n_shelves_min: 4            # per-ep random shelf count low (set n_shelves to pin a fixed count)
    n_shelves_max: 7            # per-ep random shelf count high
    shelf_length: 0.20          # m; shelf length along belt (x)
    stack_height: 0.39          # m; bottom→top shelf span; level_gap = stack_height/(n_shelves-1)
    tilt_min_deg: 15.0          # deg; per-shelf tilt magnitude min; direction is
    tilt_max_deg: 45.0          # independently randomized per shelf, see load_actors
    bottom_clearance: 0.22      # m; bottom shelf underside → belt
    ball_radius: 0.014          # m; marble radius
    roll_speed: 0.35            # m/s; scripted slide speed (non-reactive / Default)
    reactive_marble: false      # Opt 1: true = marble drops at play_once start (not on key-press)
    reactive_roll_speed: 0.09   # m/s; slide speed used only when Opt 1 (reactive_marble) is on
    oscillating_shelf_enabled: false  # Opt 2: true = one random non-top shelf sweeps -x..+x
    oscillating_shelf_period: 3.0     # s; Opt 2 full sweep cycle (episode-absolute clock)
    # oscillating_shelf_index: 1      # optional: pin which shelf oscillates (0/top rejected; default: random 1..N-1)
    bowl_radius: 0.05           # m; bowl catch geometry
    bowl_speed: 0.18            # m/s; bowl slide speed while key held
    bowl_catch_xy_tol: 0.035    # m; marble-in-bowl XY success tol
    key_x_left: -0.26           # m; left bowl-key x
    key_x_right: 0.26           # m; right bowl-key x
    key_y: -0.13                # m; both keys’ y
  catch_valley_ball:
    # Options (independent toggles):
    #   Default — red ball goes straight to the exit edge
    #   Opt 1 — wall_bounce_enabled: red ball rebounds off a side rail mid-run
    #   Opt 2 — enable_distractor: black distractor on a separate straight lane
    #            (exit points ≥ one ball diameter apart; catching black fails)
    # Platform length (down_run+up_run) samples ±20% via platform_length_scale_* .
    # Mirror — random_mirror / mirrored: x→−x; left arm places bowl when mirrored.
    ramp_half_width: 0.125      # m; valley track half-width (y extent of plates)
    ramp_thickness: 0.012       # m; plate thickness
    ramp_center_y: 0.08         # m; valley fixture y
    ramp_valley_x: -0.02        # m; valley low-point x
    ramp_valley_height: 0.025   # m; valley floor height above table
    down_run: 0.27              # m; downhill segment horizontal run (nominal)
    down_rise: 0.13             # m; downhill vertical rise (nominal)
    up_run: 0.20                # m; uphill run (nominal)
    up_rise: 0.055              # m; uphill rise (nominal)
    platform_length_scale_min: 0.8   # × nominal platform length (default −20%)
    platform_length_scale_max: 1.2   # × nominal platform length (default +20%)
    curve_segments: 16          # segments approximating curved plates
    rail_height: 0.055          # m; side-rail height
    ball_radius: 0.018          # m; ball radius
    drop_height: 0.14           # m; release height above valley entry
    drop_time: 0.60             # s; kinematic drop onto track
    wall_bounce_enabled: false  # Opt 1
    enable_distractor: false    # Opt 2
    mirrored: null              # Mirror: null=random (if random_mirror); true=left/−x; false=right/+x
    random_mirror: true         # Mirror: when mirrored is null, randomly flip layout per episode
    ball_path_mode: straight    # compat; overridden by wall_bounce_enabled
    angled_path_min_deg: 15.0   # deg; |wall rebound angle| low (Opt 1)
    angled_path_max_deg: 25.0   # deg; high
    drop_forward_angle_min_deg: -8.0  # deg; forward aim jitter low
    drop_forward_angle_max_deg: 12.0  # high
    initial_forward_speed_min: 0.90   # m/s; entry speed low
    initial_forward_speed_max: 1.10   # high
    physics_max_steps: 1200     # cap on physics-driven track phase
    red_line_gap: 0.10          # m; deadline line offset for place timing
    roll_time_min: 4.0          # s; scripted roll duration low
    roll_time_max: 7.0          # s; high
    roll_acceleration: 0.35     # along-track accel factor [0, 0.8]
    launch_speed: 0.72          # m/s; exit/launch speed off track
    idle_time_min: 1.0          # s; idle before grasp low
    idle_time_max: 2.0          # s; high
    settle_steps: 150           # post-catch settle steps
    bowl_id: 1                  # 002_bowl model_id
    bowl_scale_mult: 0.65       # bowl asset scale
    bowl_inner_radius: 0.028    # m; catch success inner radius
    bowl_outer_radius: 0.037    # m; outer rim reference
    bowl_height: 0.040          # m; bowl height used in checks
  collect_falling_bowl:
    num_objects: 4              # spheres emitted this episode
    emit_interval: 40           # physics steps between emissions
    fall_steps: 55              # steps for one sphere’s kinematic fall curve
    rim_radius: 0.055           # m; XY catch tolerance around bowl center
    pour_every: 3               # pour bowl→bin after this many catches
  cook_meat:
    # ---- knobs (change these) ----
    #   cook_button_enabled  ← Opt 1 (default false = contact cook, no key)
    #   dual_setup_enabled   ← Opt 2; dual stations, both arms; ≥10 cm clearance
    #   cook_steps           ← nominal cook duration (steps for doneness 0→1)
    #   cook_speed_jitter    ← per-ep ± fraction on cook_steps (default 0.20)
    #   key_offset_x         ← |lateral| key offset from pan (same side as station)
    #   key_y_bias           ← key y relative to pan
    #   key_press_depth      ← EE press depth onto keycap
    #   target_doneness_*    ← success / expert cook band
    #   cook_doneness_tol    ← |grasp_doneness − target|; dual needs BOTH steaks in band
    # Combinations:
    #   Default            : single + contact cook (no key)
    #   Opt1               : single + red key hold-to-cook
    #   Opt2               : dual stations, contact cook (no keys); both steaks cooked
    #   Opt1+2             : dual stations, each with its own cook key; both steaks cooked
    # CLI: --task-arg cook_button_enabled=... / dual_setup_enabled=...
    #      --option 1 | --option 2
    cook_steps: 5000            # CHANGE: nominal steps for doneness 0→1.0 (~10 s to medium@0.5, 250Hz)
    cook_speed_jitter: 0.20     # CHANGE: per-ep cook_steps ~ U(nom×(1±jitter))
    cook_button_enabled: false  # CHANGE: Opt 1; true = hold red key to cook
    dual_setup_enabled: false   # CHANGE: Opt 2; true = dual stations (both arms)
    key_offset_x: 0.14          # CHANGE: m; |lateral| distance of key from pan center
    key_y_bias: -0.04           # CHANGE: m; key y relative to pan (toward robot)
    key_press_depth: 0.055      # CHANGE: m; EE press depth onto keycap
    place_jitter_xy: 0.01       # CHANGE: ±m XY jitter on pan/board (small diversity)
    place_yaw_lim: 0.175        # CHANGE: ±rad Z yaw on pan/board (~10 deg)
    target_doneness_min: 0.45 # CHANGE: tight band around medium
    target_doneness_max: 0.55
    cook_doneness_tol: 0.08   # CHANGE: |grasp_doneness − target| per steak (dual: both)
    place_dx: 0.010           # center the steak in the bowl (+x)
    place_dy: -0.015          # center the steak in the bowl (-y)
    board_scale_mult: 0.075 # cutting board size (steak starts and finishes here)
    # plate removed: cooked steak returns to the cutting board
  cup_curtain_slot:
    curtain_freq: 0.5           # curtain sway cycles per sim-second-equivalent (opt2)
    curtain_amp: 0.05           # m; lateral sway amplitude of curtain group
    belt_speed: 0.08            # m/s nominal; each episode samples ±belt_speed_jitter
    belt_speed_jitter: 0.20     # fraction; speed ~ U((1-j)*nom, (1+j)*nom)
    curtain_size_jitter: 0.20   # fraction; curtain strip half-size ~ U((1-j), (1+j)) * nominal
    belt_range: 0.08            # m; yellow sticks travel ±this on the fixed plate
    placement_tol: 0.05         # m; placement_score / success tolerance
    gap_tol: 0.06               # m; curtain-gap vs corridor alignment for “open”
    reach_tol: 0.05             # m; yellow-gap vs corridor alignment for reach
    moving_component_spacing: 0.10  # m; yellow-stick center spacing (2cm tighter)
    blue_curtains_enabled: false # opt1: spawn blue curtain strips
    blue_curtain_dynamic_enabled: false  # opt2: if true, curtains also sway (implies opt1)
    random_mirror: true         # randomly mirror across y-axis (x→−x); left arm when mirrored
    lift_off_only_after_place: false  # if true, only lift after successful place
    post_place_lift_z: 0.10     # m; +Z lift after place
  dispense_gummy:
    # Options (independent toggles):
    #   Default — alternating target/distractor patterns; discrete belt station hops
    #     layout_mode: alternating
    #     belt_continuous_motion: false
    #   Opt 1 — randomized gummy layout → layout_mode: random
    #     At most one target at each depth; both tubes may hold distractors.
    #     CLI: --task-arg layout_mode=random   or   --option 1
    #   Opt 2 — continuous bowl motion → belt_continuous_motion: true
    #     Hold arrow key to slide the bowl; episode speed ~ U((1±jitter)*bowl_speed).
    #     CLI: --task-arg belt_continuous_motion=true   or   --option 2
    tube_capacity: 4            # slots / gummies per tube
    layout_mode: alternating    # Default: alternating; Opt 1: random
    belt_continuous_motion: false  # Opt 2: false = discrete hops; true = hold-to-slide
    target_color: yellow        # yellow|blue — color to catch
    ball_diameter: 0.03         # m; gummy diameter
    ball_slot_gap: 0.003        # m; vertical gap between stacked gummies in tube
    tube_inner_radius: 0.017    # m; must exceed ball radius
    tube_wall_thickness: 0.003  # m; tube wall thickness
    tube_bottom_z_offset: 0.075 # m; tube bottom above table
    tube_center_y: 0.03         # m; shared tube y
    tube_x_left: -0.06          # m; left tube x
    tube_x_right: 0.06          # m; right tube x
    bowl_radius: 0.06           # m; catch bowl radius
    bowl_align_tol: 0.035       # m; bowl XY under dispenser for catch
    bowl_catch_z_tol: 0.025     # m; Z band for counting a catch
    belt_thickness: 0.015       # m; bowl belt slab thickness
    belt_move_steps: 30         # Default discrete: steps for one station hop
    bowl_speed: 0.15            # Opt 2 continuous: nominal bowl speed (m/s)
    belt_speed_jitter: 0.20     # Opt 2: per-episode speed × U(1±jitter)
    belt_key_x: 0.26            # m; belt-control keys x
    belt_key_y_left: -0.14      # m; left belt-key y
    belt_key_y_right: -0.06     # m; right belt-key y
    key_x: -0.26                # m; dispense-button x
    key_y: -0.13                # m; dispense-button y
    dispense_steps: 24          # steps for one dispense animation / drop
    press_hold_steps: 6         # steps holding dispense key
    post_press_dwell: 10        # steps after press before next action
  dual_hole_punch:
    # Options (independent toggles):
    #   Opt 1 — missing tile (alternate 1-arm vs 2-arm punches) → missing_tile_mode
    #     CLI: --task-arg missing_tile_mode=true   or   --option 1
    #   Opt 2 — continuous belt vs discrete stop-per-tile → belt_continous_motion
    #     DEFAULT false = discrete: tiles STOP under stamps so both arms press together.
    #     Pause under stamp capped by tile_pause_s (2.0 s). true = never stop.
    #     Continuous uses belt_speed × belt_continuous_speed_scale (default 2×).
    #     CLI: --task-arg belt_continous_motion=true   or   --option 2
    # Tile spacing is always variable (not an option); gaps ~ U(square_gap_min, square_gap_max).
    n_pages: 4                  # tiles/pages per side
    punch_tol: 0.035            # m; punch alignment tolerance
    belt_inward_reach: 0.13     # m; belt travel toward table center
    belt_outward_scale: 2.0     # outward_reach = inward_reach × scale
    missing_tile_mode: false    # Opt 1: true = one random missing tile (1- vs 2-arm stops)
    belt_continous_motion: false # Opt 2: false = discrete stop-per-tile (default); true = continuous
    tile_pause_s: 2.0           # Opt 2 discrete: seconds the tile holds under the stamp
    belt_speed: 0.0002          # m per physics step (discrete); continuous uses × scale below
    belt_continuous_speed_scale: 2.0  # Opt 2: multiply belt_speed when continuous
    square_gap_min: 0.010       # m; variable-spacing min gap
    square_gap_max: 0.030       # m; variable-spacing max gap
  goalkeeper:
    # Options (independent toggles):
    #   Option 1 — field players (bounce) → players_enabled
    #     CLI: --task-arg players_enabled=true   or   --option 1
    #   Option 2 — field cover (tunnel) → cover_enabled
    #     CLI: --task-arg cover_enabled=true     or   --option 2
    #     ≥10 cm open on ball-drop side; ≥10% of field length open before red line
    #   Mirror — flip whole field to −x (left gripper)
    #     CLI: --task-arg mirrored=true
    #     mirrored: null + random_mirror → 50/50; mirrored true/false forces side
    players_enabled: false      # Option 1: spawn field players; ball bounces off one toward goal
    players_max: 2              # Option 1: number of static field players
    player_model: 223_soccer_player  # Option 1: CC0 soccer player mesh (width = keeper)
    player_half_xy: 0.018       # Option 1: m; footprint half-extent (= ball_radius / keeper half)
    player_half_z: 0.0435       # Option 1: m; player half-height from mesh
    player_corridor_margin: 0.04 # Option 1: m; keep players clear of ball start
    player_y_spread: 0.20       # Option 1: m; ±y band about goal_center_y for player spawn
    player_separation: 0.15     # Option 1: m; min clear gap (edge-to-edge) between players
    player_max_goal_dist_mult: 2.0 # Option 1: max |goal−player| x = this × green_area_x_len
    player_goal_face_bias: 0.22 # Option 1: blend face-partner (0) vs face-goal (1)
    cover_enabled: false        # Option 2: mid-field tunnel/cover; ball enters then exits before red line
    cover_entry_gap: 0.10       # Option 2: m; min open gap on the ball-drop side
    cover_exit_gap_frac: 0.10   # Option 2: fraction of (start→red_line) left open before red line
    cover_half_y: 0.12          # Option 2: m; half-width of cover cavity
    cover_clearance_z: 0.12     # Option 2: m; clear height under roof
    cover_wall_t: 0.008         # Option 2: m; side wall thickness
    cover_roof_t: 0.006         # Option 2: m; roof thickness
    cover_len_min: 0.10         # Option 2: m; min cover length (x); max = full spannable mid region
    cover_player_clearance: 0.02 # Option 1+2: m; cover ends this far before nearest player
    net_enabled: true           # Soccer-style visual net bag behind the goal mouth
    net_depth: 0.09             # m; net depth behind the posts
    net_cell: 0.028             # m; approximate mesh cell size
    net_strand_t: 0.0022        # m; strand thickness
    mirrored: null              # Mirror: null=random (if random_mirror); true=left/−x; false=right/+x
    random_mirror: true         # Mirror: when mirrored is null, randomly flip layout per episode
    ball_speed: 0.0375          # m/s; nominal; episode speed samples ±20% (scale 0.8–1.2)
    ball_speed_scale_min: 0.8   # low scale vs ball_speed
    ball_speed_scale_max: 1.2   # high scale vs ball_speed
    ball_angle_deg_min: -10.0   # deg; path angle vs goal-axis min (straight-shot mode)
    ball_angle_deg_max: 10.0    # deg; max
    goal_center_y: 0.05         # m; goal mouth center y (along table)
    goal_center_y_jitter: 0.0   # m; ± uniform jitter on goal_center_y
    green_area_x_len: 0.10      # m; keeper placement zone depth (toward field)
    green_area_y_extra: 0.05    # m; extra half-width beyond goal posts
    red_line_x: 0.10            # m; deadline offset from goal (last legal place)
    goal_x: 0.30                # m; |goal x|; side randomized ±
    keeper_x: 0.16              # m; |target keeper x| in green zone
    keeper_goal_clearance: 0.05 # m; keep keeper clear of goal frame
    keeper_pose_tol: 0.03       # m; place accuracy tol for expert/check
  hit_target:
    # Options (independent toggles):
    #   Opt 1 — static blocker  →  blocker_enabled   (green disc, fixed at x=0)
    #   Opt 2 — dynamic blocker →  blocker_dynamic   (red disc, sways with target)
    #   Opt 1+2: both discs; red (dynamic) sits dual_blocker_gap in front of green (static)
    # Arm side: null = random left/right each episode (exact mirror about table midline x=0).
    #   left → −x stick + left arm; target/dyn path stays on x∈[−span,0].
    #   right → +x stick + right arm; target/dyn path stays on x∈[0,span].
    #   CLI: --task-arg arm_side=left   or   --task-arg arm_side=right
    arm_side: null                 # null=random; left|right to force
    blocker_enabled: false         # Opt 1: green static blocker in front of target
    blocker_dynamic: false         # Opt 2: red dynamic blocker (sways on stick's half)
    dual_blocker_gap: 0.010        # Opt 1+2: m; dynamic in front of static (−y)
    board_half_size: 0.075      # m; outer board half-size (alias board_radius)
    center_half_size: 0.018     # m; yellow bullseye half-size (alias center_radius)
    sway_amp: 0.243             # m; half-table outer span (+0.10 m vs 0.143; then ×U(0.7,1.0))
    sway_period: 900            # sim steps per full sway cycle (jittered)
    target_speed: 0.65          # base sway-rate mult; per-ep ×U(1±speed_jitter_frac)
    blocker_speed: 0.65         # Opt 2: match target_speed so opposite phase stays usable
    speed_jitter_frac: 0.20     # ± fraction for target_speed and blocker_speed
    target_y_offset: 0.050      # m; added to base target y (~0.08)
    target_center_x: 0.0        # unused (path is side-mapped from dart_side); kept for compat
    motion_x_min: -0.272        # m; left outer clamp (+0.10 m vs 0.172)
    motion_x_max: 0.272         # m; right outer clamp
    blocker_radius: 0.028       # m; disc radius (30% smaller diameter than 0.040)
    blocker_thickness: 0.002    # m; blocker disc thickness
    # Distance from target to first/static blocker sampled per episode in [min, max].
    blocker_y_gap_min: 0.050    # m; Opt1 / Opt2 / Opt1+2 static (5 cm)
    blocker_y_gap_max: 0.080    # m; (8 cm)
    blocker_z_offset: 0.0       # m; MUST stay 0 — blocker centers at same height as target center
    blocker_x_offset: 0.0       # m; lateral offset (static stays at midline + this)
  load_train:
    # Options (independent toggles; Opt 1+2 can both be on):
    #   Default — 3 open wagons (all red) + closed loco; drop into ANY wagon succeeds;
    #     no tunnel. Ball side is random each episode (left arm if −x, right if +x).
    #   Opt 1 — target_wagon_mode: pick one wagon at random as the drop target; that
    #     wagon is red and the other two are gray; success only in the red wagon.
    #     CLI: --task-arg target_wagon_mode=true   or   --option 1
    #   Opt 2 — tunnel_enabled: arched tunnel on the far (back) arc (2–4 wagon spans),
    #     upper half only — same tunnel as before.
    #     CLI: --task-arg tunnel_enabled=true     or   --option 2
    #     tunnel_enabled: random still samples with tunnel_prob.
    #   Opt 1+2 — red target wagon + tunnel (set both flags).
    n_wagons: 3                 # open cargo wagons (plus closed loco); default = 3
    target_wagon_mode: false    # Opt 1: one random red target wagon; others gray
    tunnel_enabled: false       # Opt 2: back-arc arched tunnel (true|false|random)
    tunnel_prob: 0.55           # P(tunnel) only when tunnel_enabled=random
    tunnel_n_wagons_min: 2      # Opt 2: tunnel length in wagon-spans (low)
    tunnel_n_wagons_max: 4      # Opt 2: high
    tunnel_center_jitter: 0.40  # Opt 2: rad; L/R of 12 o'clock for tunnel center
    rail_radius: 0.20           # m; circular rail radius
    train_omega_min: 0.10       # rad/(step·0.01); per-ep speed sample low
    train_omega_max: 0.18       # high; signed direction random ±
    ball_side: random           # random|left|right — ball on −x/+x; matching arm grasps
    ball_lateral_min: 0.07      # m; |x| spawn range low
    ball_lateral_max: 0.12      # m; high
    ball_y_jitter: 0.02         # m; ±y around near-rail spawn
    ball_radius: 0.015          # m; ball radius
    car_floor_h: 0.014          # m; wagon bed thickness
    car_half_len: 0.045         # m; car half-length along rail
    car_half_wid: 0.040         # m; car half-width
    car_arc_spacing: 0.10       # m; arc spacing between car centers
    car_wall_h: 0.036           # m; wagon wall height
    ball_side_clearance: 0.11   # m; keep ball clear of passing wagons pre-grasp
    release_clearance_z: 0.20   # m; release height above rail
    transport_clearance_z: 0.22 # m; carry height above train
    pass_angle_offset: 0.22     # rad; side-biased drop station on near arc
    align_tol: 0.055            # m; wagon under drop before release
    release_open_steps: 300     # steps during open_gripper / fall lead
    post_release_steps: 500     # settle steps after release
    catch_radius: 0.055         # m; ball-in-wagon catch radius
    drop_reach_tol: 0.030       # m; commanded vs actual drop miss allowed
    latch_z_max: 0.015          # m; max ball height above bed to latch
    latch_settle_steps: 12      # consecutive near-floor frames before latch
  marble_shelf_maze:
    # Options (independent toggles; Opt 1+2 can both be on):
    #   Default — after each inter-shelf drop the marble snaps to rest at the shelf centre
    #   Opt 1 — continuous_ball_motion: landed marble keeps real dynamics (no centre snap)
    #     CLI: --task-arg continuous_ball_motion=true   or   --option 1
    #     Alias: natural_ball_stop=true
    #   Opt 2 — oscillating_bowl_enabled: bowl sweeps left↔right under the maze; last drop
    #     must be timed so the marble falls into the moving bowl
    #     CLI: --task-arg oscillating_bowl_enabled=true   or   --option 2
    n_shelves: 4                # shelf count (2–6 hard max); or use n_shelves_min/max
    shelf_length: 0.18          # m; shelf length along x (10% wider each side vs 0.15)
    glass_gap: 0.05             # m; spacing between the two glass panes
    shelf_half_depth: 0.0125    # m; shelf half-extent in y (into gap)
    shelf_half_thick: 0.00625   # m; shelf half-thickness in z
    level_gap: 0.055            # m; nominal vertical spacing between shelf centers
    level_gap_jitter: 0.35      # ±fractional jitter per gap (renormalized to sum)
    overlap_min: 0.30           # min overlap as fraction of shelf_length
    overlap_max: 0.75           # max overlap as fraction of shelf_length
    bottom_clearance: 0.15      # m; bottom shelf → table clearance
    ball_radius: 0.012          # m; marble radius
    roll_off_speed: 0.06        # m/s; horizontal kick when leaving a shelf edge
    continuous_ball_motion: false  # Opt 1: true = keep rolling after landing (no centre snap)
    continuous_ball_speed_scale: 0.40   # Opt 1: multiply roll_off_speed (slower release)
    continuous_tilt_duration_scale: 1.50  # Opt 1: slower tilt / slide-to-edge
    # natural_ball_stop: false     # legacy alias of continuous_ball_motion
    oscillating_bowl_enabled: false  # Opt 2: true = bowl oscillates L↔R under the maze
    oscillating_bowl_period: 3.0     # s; Opt 2 full L→R→L cycle
    tilt_angle_deg: 45.0        # deg; max shelf tilt toward pressed side
    tilt_duration_sec: 0.5      # s; tilt/reset duration if smooth_tilt=false
    smooth_tilt: false          # true: use tilt_speed_deg_per_sec instead of fixed duration
    tilt_speed_deg_per_sec: 30.0  # deg/s; used only when smooth_tilt=true
    fall_settle_steps: 160      # physics steps after inter-shelf drop
    final_fall_settle_steps: 220  # physics steps for final drop into bowl
    button_x: [-0.18, 0.18]     # button x positions (scaled with wider shelves)
    button_press_depth: 0.03    # m; EE press depth
    press_hold_steps: 20        # steps holding button down
    post_press_dwell: 10        # steps after release before next action
    bowl_scale_mult: 0.65       # uniform bowl asset scale
    bowl_catch_radius: 0.032    # m; XY catch tolerance around bowl center
  packing:
    # Options (independent toggles; Opt 1+2 can both be on):
    #   Opt 1 — random single-or-pair waves  →  spawn_mode: random
    #           (+ pair_stagger_enabled, single_wave_any_belt)
    #   Opt 2 — black distractor fruit       →  distractor_enabled
    n_per_color: 3              # number of each colored fruit (apples + oranges)
    # n_apple: 3                # optional per-color override (falls back to n_per_color)
    # n_orange: 3
    spawn_mode: random          # Opt 1: random (single|pair per wave) | parallel | single
    spawn_delay_s: 2.0          # unused (compat); spawn is gated on drop / belt-exit
    belt_gap: 0.10              # m; gap between the two belts, centered at x=0
    belt_speed: 0.0008          # m per belt tick nominal; both belts use this
    belt_speed_jitter: 0.20     # fraction; each ep/side ~ U((1-j)*nom, (1+j)*nom)
    # belt_speed_left: 0.0008   # optional per-belt override (falls back to belt_speed)
    # belt_speed_right: 0.0012
    advance_every: 3            # physics steps between belt ticks
    spawn_gap: 0.16             # m; min spacing between successive spawns
    pick_y: 0.24                # m; start arm approach; fruit keeps rolling
    pick_y_end: -0.16           # m; past this, too late; fruit loops to far end
    pick_station_y: 0.02        # m; hover/grab line; fruit rolls through without pausing
    fruit_scale: 0.80           # larger fruit → easier grasp
    basket_y: 0.0               # m; table midline (toward belts)
    basket_x: 0.34              # m; nudged out so the bigger basket clears the belts
    basket_scale: 1.15          # bigger opening — easier drop-in target
    pick_lift: 0.10             # m; raise gripper +Z after grasp, then slide over basket and release
    pair_stagger_enabled: true  # Opt 1: pair Y gap ~ U(0, fruit_diameter) each wave
    # pair_stagger_y: null      # optional max gap (m); default = fruit diameter
    single_wave_any_belt: true  # Opt 1: single fruit may appear on either belt
    distractor_enabled: false   # Opt 2: black distractor fruit on the belts
    distractor_prob: 0.4        # Opt 2: chance per real spawn-wave that a distractor also spawns
    distractor_color: [0.05, 0.05, 0.05]  # Opt 2: black
    distractor_min_gap_mult: 2.0  # Opt 2: min Y gap vs same-belt real fruit, × fruit diameter
  pick_cup_behind_fan:
    fan_omega_deg: 2.0          # deg per physics step (then ×U(0.8,1.3) per ep)
    gap_frac: 0.40              # fraction of each 120° period that is a safe blade gap
    theta_spill: 35.0           # deg; cup tilt from vertical → spill fail
    fan_far_y: 0.12             # unused (compat); cup y is sampled in code
  pick_ripe_apple:
    # Default: single good apple (green→red→black) + static basket.
    # Opt 1 — two_apples_enabled / spoiled_apple_enabled: second yellow→black apple (do not pick)
    # Opt 2 — basket_move_enabled: basket oscillates between branch-tip X bounds
    ripen_steps: 2500           # sim steps for ripeness 0→1 while apple hangs on the tree
    red_window_min: 0.48        # per-ep red target band low (like cook_meat doneness)
    red_window_max: 0.52        # high; ~0.5 = vivid red
    red_tolerance: 0.12         # how close to target before expert fires grasp
    tree_x: 0.0                 # m; tree at table centerline
    tree_y: 0.05                # m; toward back wall (wall is at y=1; table ~±0.35)
    basket_x: 0.0               # m; basket start X (then oscillates if Opt 2)
    basket_y: -0.20             # m; clearance so grasp approach clears the rim
    basket_scale: 1.0           # 076_breadbasket scale (packing uses ~1.15)
    two_apples_enabled: false   # Opt 1: second spoiled apple (alias: spoiled_apple_enabled)
    basket_move_enabled: false  # Opt 2: ping-pong between tree_x ± apple_hang_dx
    basket_speed_min: 0.08      # Opt 2: m/s lower bound (per-ep Uniform)
    basket_speed_max: 0.16      # Opt 2: m/s upper bound
    apple_hang_dx: 0.18         # m; |x| of hanging apple from trunk (branch tip / basket bound)
    branch_z_high: 0.25         # m; taller branch (+10 cm from 0.15)
    branch_z_low: 0.20          # m; shorter branch (+10 cm from 0.10)
    high_branch_side: random    # left|right|random — which side gets the higher branch
    trunk_height: 0.50          # m; +20 cm from 0.30; canopy only at the top
    apple_drop_below_branch: 0.042  # m; lower so ~½ black stem shows under branch
    apple_x_jitter: 0.02        # m; stem+apple x ∈ [branch tip − jitter toward bark, branch tip]
    good_side: random           # left|right|random — which apple is the red-path (pickable) one
    apple_side: random          # alias of good_side (compat)
    apple_scale_mult: 0.78
  place_block_belt:
    # Options (independent toggles):
    #   Opt 1 — moving bowl  →  bowl_move_enabled
    #   Opt 2 — belt blocker →  blocker_enabled
    bowl_move_enabled: true        # Opt 1: bowl oscillates along FULL belt y (even with Opt 2)
    bowl_move_speed: 0.30          # Opt 1: nominal m/s; per-ep ×U(1±speed_jitter_frac)
    place_line_offset: 0.10        # m; red line from load edge; cube must contact before it
    blocker_enabled: false         # Opt 2: red rod on belt; place cube in clear y-lane
    blocker_start_clearance: 0.15  # Opt 2: m; min near-face distance from belt load edge
    blocker_length_frac_min: 0.20  # Opt 2: rod y-size as fraction of belt width
    blocker_length_frac_max: 0.30  # Opt 2: upper y-size frac
    blocker_half_x: 0.012          # Opt 2: nominal rod half-thickness along flow (m)
    blocker_half_x_jitter_frac: 0.50  # Opt 2: per-ep half_x ∈ nom*(1±this)
    belt_speed: 0.06               # nominal m/s; per-ep ×U(1±speed_jitter_frac)
    speed_jitter_frac: 0.20        # ± fraction for belt_speed and bowl_move_speed
    theta_max_deg: 30.0         # deg; tilt metric: score = 1 − max_tilt/theta_max
    belt_ride_steps: 600        # max physics steps to let block ride belt
    block_belt_clearance: 0.05  # m; min edge-to-edge gap from cube to belt
    block_y_jitter: 0.05        # m; cube y = belt_y ± this
    random_belt_flip: true      # mirror layout about x=0 (left or right arm places)
  play_billiard:
    # Options (independent toggles):
    #   Default — only the red target ball; success in any of the 6 pockets
    #   Opt 1 — specific_hole: one top pocket (L/M/R) + yellow arrow at that hole
    #     CLI: --task-arg specific_hole=true   or   --option 1
    #   Opt 2 — enable_distractors: up to 2 colored balls; any pocket still OK
    #     CLI: --task-arg enable_distractors=true   or   --option 2
    #   Opt 1+2 — distractors block exactly one hole; target = random open top pocket
    # Legacy: pocket_mode=top_three → Opt1; blocker_mode=path_to_top|... → Opt2
    specific_hole: false
    enable_distractors: false
    num_extra_balls: 2          # used when Opt2 on; 0 → sample 1–2 per episode
    # bounce_threshold: 0.15    # PhysX min |v_rel| for restitution (default cue ~0.55 m/s)
    ball_radius: 0.012          # m; pocket diameter defaults to 1.2× ball diameter
    table_cx: 0.0               # m; table center x
    table_cy: 0.1               # m; table center y
    table_half_len: 0.22        # m; half-length along +X
    table_half_wid: 0.14        # m; half-width along +Y
    settle_steps: 500           # physics steps after strike
    strike_impulse: 0.55        # impulse magnitude applied on tip–ball contact
  quality_control:
    # Default: color_mode=alternating, black_frac_max=0 (no distractors)
    # Opt 1: color_mode=random | Opt 2: black_frac_max>0 (e.g. 0.50)
    # tile_pause_s = max hold under stamp; miss unstamped red/green → fail
    n_tiles: 6
    color_mode: alternating
    spacing_mode: random
    tile_spacing: 0.08
    spacing_min: 0.07
    spacing_max: 0.14
    black_frac_max: 0.0
    tile_pause_s: 2.0
  ring_on_moving_peg:
    r_ring: 0.028               # m; ring radius
    catch_r: 0.07               # m; catch / success radius
    period: 3000                # sim steps per peg motion cycle
    amp_x: 0.010                # m; peg X oscillation amplitude
    amp_y: 0.025                # m; peg Y oscillation amplitude
    amp_z: 0.018                # m; peg Z oscillation amplitude
  rotating_shape_sorter:
    spin_speed: 1.9             # angular speed baseline; dir random ±
    spin_speed_jitter: 0.20     # sample speed ~ U(spin_speed×0.8, spin_speed×1.2)
    # spin_speed_min / spin_speed_max: optional absolute range (overrides jitter when both set)
    r_tol: 0.06                 # unused; code reads hole_align_tol (default 0.015 m)
    align_window: 0.18          # unused; no matching key in envs/rotating_shape_sorter.py
    max_track_steps: 900        # unused; code uses align_search_steps (default 1200)
    ball_color: [0.90, 0.10, 0.10]  # red
    ball_side: random           # random|left|right — either arm operates
    ball_x_jitter: 0.02         # m; small ±x spawn randomness
    ball_y_jitter: 0.045        # m; ±y spawn randomness
    force_platform_miss: false  # true = drop onto solid / dummy for failure demos
    hole_xy_jitter: 0.012       # m; ±x/±y randomization for target hole and dummy hole centers
    # Independent feature toggles (both may be true):
    stick_to_surface: false     # Opt1: latch ball on platform if dropped off the real hole
    add_dummy_hole: false       # Opt2: cut opposite-corner decoy hole slightly smaller than ball
    # ---- Opt1 (stick_to_surface) params ----
    stick_contact_steps: 4      # frames on platform with NO hole overlap before latch (fail)
    stick_settle_steps: 12      # near-rest frames WITH hole overlap before latch on rim
    stick_vel_tol: 0.05         # m/s; settle speed threshold
    stick_z_tol: 0.012          # m; max height above platform rest pose to count as contact
    # ---- Opt2 (add_dummy_hole) params ----
    dummy_hole_radius_frac: 0.92  # ~just under ball diameter; ball can wedge in, cannot fall through
    dummy_hole_nest_depth: 0.35   # sink depth as fraction of ball_radius when stuck in dummy hole
    # dummy_hole_radius: 0.023    # optional absolute m; if set, overrides radius_frac
  sort_apples_belt:
    n_apples_min: 4             # fixed episode size (all options)
    n_apples_max: 4
    belt_speed_min: 0.0014      # 30% below max; per-ep U[min, max]
    belt_speed_max: 0.0020      # upper = current (post-×2) speed; ~0.12 m/s surface w/ advance_every
    belt_speed_scale: 1.0       # multiplier on sampled belt_speed
    advance_every: 4            # physics steps between belt ticks
    gate_default_left: true     # diverter aims left before first button press
    # Options (independent toggles):
    #   Default — alternating red/green  →  color_mode: alternating
    #   Opt 1 — random red/green         →  color_mode: random   (--option 1)
    #   Opt 2 — rotten apple + dump bin  →  rotten_prob: 0.3     (--option 2)
    #     With P=rotten_prob, one random apple is brown; both buttons open the
    #     two-piece wooden plank so it rides into the garbage bin at lowest y.
    color_mode: alternating
    rotten_prob: 0.0
  toast_bread:
    toast_steps: 1000           # sim steps on steamer for doneness 0→1 (longer = slower toast)
    target_doneness: 0.45       # lift-off target in [0,1]; ~0.45 = golden
    plate_scale_mult: 0.65      # uniform scale for serving plate asset
    steamer_scale_mult: 0.10    # uniform scale for steamer (raw asset is huge)
  two_type_sorting_catch:
    num_objects: 4              # total objects emitted
    fall_steps: 90              # physics steps for one curved descent
    lateral_bias: 0.16          # m; |x| drift toward owning side at landing
    center_rate: 0.25           # fraction of near-center (ambiguous) spawns
    catch_tol: 0.07             # m; bowl XY catch tolerance
  whack_a_mole:
    num_moles: 2                # default: 2 moles; cosine bob, speed in [60%, 100%] of pop_speed
    # Opt 1 — rabbit distractor (avoid; touching fails). Combinable with Opt 2.
    #   CLI: --task-arg distractor_enabled=true   or   --option 1
    distractor_enabled: false
    num_distractors: 1          # rabbits when Opt 1 on (clamped to free holes)
    # Opt 2 — moles reappear from a free hole each time they go down.
    #   CLI: --task-arg relocating_moles=true     or   --option 2
    relocating_moles: false
    difficulty: easy            # easy = one mole at a time; hard = two simultaneous (both arms)
    pop_steps: 0                 # 0 = continuous bob (no crown freeze)
    pop_speed: 0.064            # m/s peak |dz/dt|; 20% below prior 0.08
    mole_speed_spread: 0.40     # lower = pop_speed * (1 - spread)
    press_ready_frac: 0.18      # jab early mid-rise; mallet meets crest
    approach_max_frac: 0.35     # re-hover while mole is this low
    approach_falling_frac: 0.55 # or mid-fall (never crest)
    hover_clearance: 0.018       # m; short jab above raised mole
    touch_tol: 0.04             # m; cube–mole XY touch tolerance
    hole_count: 9               # openings on board
    hole_size: 0.0825           # m; hole opening side length
    hole_bar_thickness: 0.014   # m; bar thickness between holes
    cube_hole_scale: 1.20       # mallet cube side = hole_size * scale (>1 so it can't enter)
    cube_grasp_drop_z: 0.05     # m; lower cube below finger midpoint after grasp
    mole_scale_mult: 1.80       # 1.5x prior mole size
    mole_height: 0.1053         # m; world height after mole_scale_mult (pop travel)
    rabbit_scale_mult: 1.00     # 224_rabbit authored near mole height
    rabbit_height: 0.1047       # m; rabbit world height
    table_height_bias: 0.05     # m; raise table (+board) this much
    board_z_lift: 0.12          # m; play surface above table; solid base sits on table
    board_color: [0.98, 0.82, 0.05]  # RGB board color (yellow)
