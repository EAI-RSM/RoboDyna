# KitchenS beer-tap demo — dual UR5e + WSG gripper.
render_freq: 0
episode_num: 1
use_seed: false
save_freq: 18
embodiment: [ur5-wsg, ur5-wsg, 0.6]
language_num: 100
use_dynamic: false
dynamic_level: 1
dynamic_coefficient: 0.1
domain_randomization:
  random_background: false
  cluttered_table: false
  clean_background_rate: 1
  random_head_camera_dis: 0
  random_table_height: 0
  random_light: false
  crazy_random_light_rate: 0
camera:
  head_camera_type: D435
  wrist_camera_type: D435
  collect_head_camera: true
  collect_wrist_camera: true
data_type:
  rgb: true
  third_view: true
  depth: false
  pointcloud: false
  observer: false
  endpose: true
  qpos: true
  mesh_segmentation: false
  actor_segmentation: false
pcd_down_sample_num: 1024
pcd_crop: true
save_path: ./data
clear_cache_freq: 5
collect_data: true
eval_video_log: true
save_failed_cases: false
check_render_success: false
task_args:
  pour_beer:
    scene_id: 0
    # Fill / foam speeds: set a scalar, a [lo, hi] list, or use *_range with
    # randomize_rates: true (samples once per episode from the class defaults
    # or the explicit ranges below).
    randomize_rates: true
    pour_rate_range: [0.00040, 0.00075]
    # Peak foam % after a continuous open pour (ramps from foam_gain_start).
    foam_gain_range: [0.65, 1.05]
    foam_gain_start_range: [0.10, 0.28]
    foam_ramp_steps_range: [50, 100]
    foam_decay_range: [0.0035, 0.0060]
    # Fallback scalars when randomize_rates is false:
    pour_rate: 0.00055
    foam_gain_start: 0.18
    foam_gain: 0.85
    foam_ramp_steps: 70
    foam_decay: 0.0045
    tap_settle_sec: 1.0  # tap must stay closed this long before success
    open_gap_timeout_sec: 5.0  # closed >this since last opening → end & score
    expert_foam_pause: 0.16
    expert_foam_resume: 0.09
    target_liquid: 0.90
    full_liquid_tol: 0.05
    overflow_level: 1.0
    safe_total: 0.90
    # Layout: tap L/R + Y in [baseline−10cm, baseline]; mug under nozzle; props AABB-clear.
    randomize_layout: true
    station_side: random
    station_x: 0.10
    cup_y: -0.08
    tap_dy: 0.12
    tap_y_down: 0.10
    station_x_range_left: [-0.16, -0.06]
    station_x_range_right: [0.06, 0.16]
    station_x_range: [0.06, 0.16]
