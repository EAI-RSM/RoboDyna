  all: null
  base:
    catch_marbles_trapdoors: {default: [10002, 10003, 10004, 10005, 10007, 10008, 10009, 10012, 10014, 10016], opt1: [10002, 10003, 10004, 10005, 10007, 10008, 10009, 10012, 10014, 10016], opt2: [10003, 10004, 10007, 10008, 10011, 10012, 10014, 10018, 10023, 10024], opt1+2: [10003, 10004, 10007, 10008, 10011, 10012, 10014, 10018, 10023, 10024]}
