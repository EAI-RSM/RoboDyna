# Human-experiment GUI protocol (same folder as experiment_gui.py).
#
# Edit this file to set recording, play limits, seed, and which tasks appear.
# Task lists use 1-based card numbers (the 01, 02, … badges).
# Tutorial is 00 and is always shown; it is not part of these lists.
# Tutorial parts can be replayed unlimited times and are not written to exp_logs.
#
# Controller (robot vs keyboard+mouse) is chosen in the experiment GUI after
# login. Logs live in data/exp_logs/<user>/user_robot.json or user_keyboard.json.
#
# Override path with ROBODYNA_EXPERIMENT_CONFIG=/path/to/file.yml if needed.

# Seed for each play (0–500). Global form still works:
#   null        → a new random seed every play
#   0           → the same seed every play
#   [0, 1, 2]   → 1st SUCCESS/FAILURE play uses 0, 2nd uses 1, 3rd uses 2, then wraps
#
# Per-task values live here in the experiment YAML. Base tasks can set each opt
# separately; household tasks have one value. Replace null with an int or list.
# More specific keys win over ``all``. null means random for that slot.
seed:
  all: null
  base:
    catch_marbles_trapdoors: {default: null, opt1: null, opt2: null, opt1+2: null}
    catch_ramp_ball:         {default: null, opt1: null, opt2: null, opt1+2: null}
    catch_cuboid:            {default: null, opt1: null, opt2: null, opt1+2: null}
    catch_shelf_marble:      {default: null, opt1: null, opt2: null, opt1+2: null}
    catch_valley_ball:       {default: null, opt1: null, opt2: null, opt1+2: null}
    stop_valley_ball:        {default: null, opt1: null, opt2: null, opt1+2: null}
    cook_meat:               {default: null, opt1: null, opt2: null, opt1+2: null}
    cook_meat_timer:         {default: null, opt1: null, opt2: null, opt1+2: null}
    put_cup_belt:            {default: null, opt1: null, opt2: null, opt1+2: null}
    dispense_gummy:          {default: null, opt1: null, opt2: null, opt1+2: null}
    punch_dual_holes:        {default: null, opt1: null, opt2: null, opt1+2: null}
    save_goal:               {default: null, opt1: null, opt2: null, opt1+2: null}
    hit_target:              {default: null, opt1: null, opt2: null, opt1+2: null}
    load_train:              {default: null, opt1: null, opt2: null, opt1+2: null}
    marble_shelf_maze:       {default: null, opt1: null, opt2: null, opt1+2: null}
    pack_fruits:             {default: null, opt1: null, opt2: null, opt1+2: null}
    pick_ripe_apple:         {default: null, opt1: null, opt2: null, opt1+2: null}
    place_block_belt:        {default: null, opt1: null, opt2: null, opt1+2: null}
    play_billiard:           {default: null, opt1: null, opt2: null, opt1+2: null}
    control_quality:         {default: null, opt1: null, opt2: null, opt1+2: null}
    drop_ball_hole:          {default: null, opt1: null, opt2: null, opt1+2: null}
    sort_apples_belt:        {default: null, opt1: null, opt2: null, opt1+2: null}
    whack_moles:             {default: null, opt1: null, opt2: null, opt1+2: null}
  household:
    trap_bug: null
    boil_milk: null
    fill_coffee_jar: null
    pour_beer: null
    cook_food: null
    cook_food_timer: null
    measure_ingredient: null
    make_soup: null
    catch_cup: null
    catch_mouse_object_drop: null
    stop_ball: null
    clean_table: null

# ---------------------------------------------------------------------------
# How many SUCCESS/FAILURE plays before a slot grays out.
# Stop / close the viewer does not count.
#
# One number — every visible slot:
#   plays_per_scenario: 1
#
# By scenario kind (applies to EVERY base task). This is the usual form:
#   plays_per_scenario:
#     default: 1          # Default column
#     opt1: 2             # Opt 1
#     opt2: 2             # Opt 2
#     opt1+2: 5           # Opt 1+2
#     household: 1        # household tasks (no variants)
#
# Nested under a suite if you only want it for base (or household):
#   plays_per_scenario:
#     base:
#       default: 1
#       opt1: 2
#       opt2: 1
#       opt1+2: 5
#     household: 2
#
# Optional per-task override (1-based card number still works):
#   plays_per_scenario:
#     default: 1
#     opt1+2: 5
#     base:
#       1: {opt1+2: 8}    # task 01 Opt 1+2: 8 plays; other tasks keep opt1+2: 5
#
# null / unlimited = replay forever. Base keys: default, opt1, opt2, opt1+2.
# ---------------------------------------------------------------------------
plays_per_scenario: 
  default: 1
  opt1: 1
  opt2: 1
  Opt1+2: 5
  household: 10

# Write terminal plays to data/exp_logs/<user>/user.json
# true / false = all or none. Same map form as plays_per_scenario, e.g.
#   log_plays: {opt1+2: true}     # only log Opt 1+2
log_plays: true

# HDF5 / LeRobot episode under data/<task>/  (true / false / slot map)
record_data: false

# head-camera preview mp4 after the viewer closes  (true / false / slot map)
save_video: false

# ---------------------------------------------------------------------------
# Base task index table
#   1  catch_marbles_trapdoors   Catch Marbles Trapdoors
#   2  catch_ramp_ball           Catch Ramp Ball
#   3  catch_cuboid              Catch Cuboid
#   4  catch_shelf_marble        Catch Shelf Marble
#   5  catch_valley_ball         Catch Valley Ball
#   6  stop_valley_ball          Stop Valley Ball
#   7  cook_meat                 Cook Meat
#   8  cook_meat_timer           Cook Meat Timer
#   9  put_cup_belt              Put Cup Belt
#  10  dispense_gummy            Dispense Gummy
#  11  punch_dual_holes          Punch Dual Holes
#  12  save_goal                 Save Goal
#  13  hit_target                Hit Target
#  14  load_train                Load Train
#  15  marble_shelf_maze         Marble Shelf Maze
#  16  pack_fruits               Pack Fruits
#  17  pick_ripe_apple           Pick Ripe Apple
#  18  place_block_belt          Place Block Belt
#  19  play_billiard             Play Billiard
#  20  control_quality           Control Quality
#  21  drop_ball_hole            Drop Ball Hole
#  22  sort_apples_belt          Sort Apples Belt
#  23  whack_moles               Whack Moles
#
# Default omits 7 cook_meat, 11 punch_dual_holes.
# This list is the *candidate pool* for sampling. Each new participant is
# assigned ``base_scenarios_per_experiment`` tasks from the categories below.
# ---------------------------------------------------------------------------
base_tasks: [1, 2, 3, 4, 5, 6, 8, 9, 10, 12, 13, 14, 15, 16, 17, 18, 19,  21, 22, 23]

# How many base tasks (one per skill category when possible) each new
# participant is assigned. Default 5 = one from each category; 0 skips the
# whole suite (no sampling, card grayed out in the experiment launcher).
# Usage counts live in data/exp_logs/base_task_usage.json and are recomputed
# from remaining participant folders (deleting a log lowers those counts).
base_scenarios_per_experiment: 5

# ---------------------------------------------------------------------------
# Base skill categories (1-based card numbers). Each new participant gets one
# sampled task from each category (see base_scenarios_per_experiment).
# Candidates are these lists intersected with base_tasks (7 and 11 are listed
# nowhere, so they stay omitted). Task 15 may be sampled for only one of its
# two categories in a given experiment. Within a category, unused / lowest-count
# tasks are preferred; if several remain unused, the next pick is random among
# those (e.g. if 2 was used and 5, 6, 12 were not, sample from 5, 6, 12).
# ---------------------------------------------------------------------------
base_task_categories:
  motion_prediction: [2, 5, 6, 12]
  state_transition: [8, 16, 17, 22]
  dynamic_pattern: [1, 3, 21, 23]
  dynamic_avoidance: [9, 13, 14, 18]
  spatial_reasoning: [4, 10, 15, 19]

# ---------------------------------------------------------------------------
# Household task index table
#   1  trap_bug                  Trap Bug
#   2  boil_milk                 Boil Milk
#   3  fill_coffee_jar           Fill Coffee Jar
#   4  pour_beer                 Pour Beer
#   5  cook_food                 Cook Food
#   6  cook_food_timer           Cook Food Timer
#   7  measure_ingredient        Measure Ingredient
#   8  make_soup                 Make Soup
#   9  catch_cup                 Catch Cup
#  10  catch_mouse_object_drop   Catch Mouse Object Drop
#  11  stop_ball                 Stop Ball
#  12  clean_table               Clean Table
#
# Default omits 3 fill_coffee_jar, 5 cook_food.
# This list is the *candidate pool* for sampling. Each new participant is
# assigned ``household_scenarios_per_experiment`` tasks (1 easy + 1 hard).
# ---------------------------------------------------------------------------
household_tasks: [1, 2, 4, 6, 7, 8, 9, 10, 11, 12]

# How many household tasks each new participant is assigned.
# Default 2 = one Easy and one Hard. Same lowest-count sampling as base.
# 0 skips the whole suite (no sampling, card grayed out in the launcher).
household_scenarios_per_experiment: 2

# Household difficulty (1-based card numbers). Candidates are intersected
# with household_tasks (3 and 5 are omitted from the pool above).
household_task_categories:
  easy: [2, 4, 6, 11, 12]
  hard: [1, 7, 8, 9, 10]
